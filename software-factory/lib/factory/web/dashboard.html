<style>
:root { color-scheme: dark;
  --bg: #1A1110; --top: #000000; --fg: #FFFFFF; --muted: #B3A8A4; --muted-strong: #CFC7C3; --soft: #E6DFDC;

  --yellow: #FECD40; --err: #FF8AC0; --err-line: #6E2A4A; --err-bg: #3A1A29; --ok: #B5E07F;
  --active-bg: #283A16; --active-fg: #B5E07F; --active-dot: #7CC63A;
  --approval-bg: #423410; --approval-fg: #FECD40; --approval-dot: #FECD40;
  --attn-bg: #4A1430; --attn-fg: #FF9CC8; --attn-dot: #FF5AA5; --attn-line: #5C2441;
  --wait-bg: #352448; --wait-fg: #D6BCEB; --wait-dot: #B98BDB;
  --neutral-fg: #D8D0CC; --paused-dot: #A99E9A; --tab-on: #C9A2E6;
  --shadow: rgba(0, 0, 0, 0.5); --bot-band: #FFFFFF; --bot-eye: #1A1110;
  --font: "Nextory Sans", Figtree, Roboto, Arial, sans-serif; }
:root[data-theme="light"] { color-scheme: light;
  --bg: #F9F5F2; --top: #FFFFFF; --fg: #1A1110; --muted: #6B5F5B; --muted-strong: #5A4E4A; --soft: #3D302F;
  --column: #F1ECE8; --panel: #FFFFFF; --panel-line: #E4DDD8; --line: #D6CDC8; --raised: #EEE7E3; --done: #F7F3F0;
  --link: #B0005A; --link-hover: #8A0047; --brand-pink: #C4005E;
  --err: #B0004F; --err-line: #F0B3CE; --err-bg: #FDEBF3; --ok: #3E7A12;
  --active-bg: #E6F4D7; --active-fg: #2F6110; --active-dot: #5DA21E;
  --approval-bg: #FFF3CC; --approval-fg: #6E5100; --approval-dot: #E0A800;

  --shadow: rgba(26, 17, 16, 0.15); --bot-band: #1A1110; --bot-eye: #FFFFFF; }
body { margin: 0; font: 14px/1.45 var(--font); background: var(--bg); color: var(--fg); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
header { background: var(--top); border-bottom: 1px solid var(--panel-line); padding: 12px 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
header .grow { flex: 1; }
/* The view tabs sit on the header's bottom edge: 13px = its bottom padding and border, so the current tab covers the border and opens into the page
   like a folder. Each view fills the whole page under the header: Backlog hides the Workspaces, Details and Terminal columns. */
header nav { display: flex; gap: 4px; align-self: stretch; align-items: flex-end; margin-bottom: -13px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 48px; height: 48px; flex: none; }
.brand .names { display: flex; flex-direction: column; }
.brand .wordmark { font-size: 22px; font-weight: 800; letter-spacing: .05em; line-height: 1.1; }
.brand .wordmark em { font-style: normal; color: var(--brand-pink); }
.brand .tagline { font-size: 11px; color: var(--muted-strong); letter-spacing: .02em; }
#updated { color: var(--muted-strong); }
.icon-button { width: 36px; padding: 0; border-radius: 50%; background: transparent; }
.icon-button svg { width: 18px; height: 18px; }
#fullscreen-toggle .exit, #fullscreen-toggle[aria-pressed="true"] .enter { display: none; }
#fullscreen-toggle[aria-pressed="true"] .exit { display: block; }
#fullscreen-toggle[aria-pressed="true"] { color: var(--brand-pink); }
.workspace { flex: 1; display: flex; min-height: 0; min-width: 0; }
.layout { flex: 1; display: flex; min-height: 0; }
#main, #sidebar, #detail-main, #live-host .xterm-viewport { overscroll-behavior: contain; }
#lcol-ws { flex: none; display: flex; min-height: 0; }
#lcol-ws .rail-tab { border-right: 1px solid var(--panel-line); }
#sidebar[hidden] { display: none !important; }
#ws-pane { position: relative; display: flex; min-height: 0; }
#ws-pane .resizer { left: auto; right: -4px; }
#sidebar[hidden] + .resizer { display: none; }
#sidebar { flex: 0 0 var(--ws-w, 220px); width: var(--ws-w, 220px); box-sizing: border-box; overflow-y: auto; min-height: 0; background: var(--column); border-right: 1px solid var(--panel-line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
#sidebar .side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px; }
#sidebar h2, #detail h2, #detail-term .thead h3 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; color: var(--muted-strong); }
#sidebar .add { min-height: 28px; min-width: 28px; padding: 0; font-size: 16px; }
.ws { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 12px; }
.ws.on { background: var(--raised); }
.ws .name { flex: 1; min-width: 0; justify-content: flex-start; text-align: left; border-color: transparent; background: transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; line-height: 36px; }
.ws input { flex: 1; min-width: 0; }
.ws .warn { color: var(--err); font-weight: 700; }
.ws .more > summary { min-height: 28px; min-width: 28px; padding: 0 6px; }
.ws .more .menu { left: auto; right: 0; }
.count.badge { background: var(--accent); color: #FFFFFF; }
.ws-error { color: var(--err); background: var(--err-bg); border: 1px solid var(--err-line); border-radius: 12px; padding: 12px 16px; margin: 0; }
.ws-list { margin: 8px 0; padding-left: 20px; }
main { padding: 20px 24px 32px; flex: 1; min-width: 0; min-height: 0; overflow: auto; display: flex; flex-direction: column; box-sizing: border-box; }
main > div { flex: 1; display: flex; flex-direction: column; }
input, select, button, textarea { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible, .link:focus-visible { outline: 2px solid var(--brand-pink); outline-offset: 2px; }
input[type=checkbox] { accent-color: var(--accent); padding: 0; }
textarea { width: 100%; box-sizing: border-box; min-height: 70px; }
button { cursor: pointer; font-size: 13px; font-weight: 600; min-height: 36px; padding: 0 14px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover:not(:disabled) { background: var(--raised); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.danger { color: var(--err); border-color: var(--err-line); }
button.tab { font-size: 15px; min-height: 44px; padding: 0 18px; background: transparent; color: var(--muted); border-color: transparent; border-bottom: 0; border-radius: 12px 12px 0 0; }
button.tab:hover:not(:disabled) { background: transparent; color: var(--fg); }
button.tab.on, button.tab.on:hover { background: var(--bg); color: var(--brand-pink); border-color: var(--panel-line); font-weight: 700; }
button.toggle { font-weight: 500; min-height: 32px; padding: 0 12px; border-radius: 16px; }
button.toggle.off { color: var(--muted); text-decoration: line-through; background: transparent; }
a, .link { color: var(--link); cursor: pointer; font-weight: 600; }
a:hover, .link:hover { color: var(--link-hover); }
.muted { color: var(--muted); font-size: 12px; }
.rename-error { color: var(--err); font-size: 12px; margin: 2px 0; }
#error { display: none; flex: none; z-index: 20; background: var(--accent); color: #FFFFFF; font-weight: 600; padding: 10px 24px; }
#banner { background: var(--yellow); color: #1A1110; font-weight: 600; padding: 10px 24px; }
#migration { background: var(--yellow); color: #1A1110; padding: 10px 24px; }
#migration ul { margin: 4px 0; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
button.launch::before { content: "+"; font-size: 1.4em; font-weight: 600; line-height: 1; }
.toolbar > button.launch { min-height: 40px; padding: 0 18px; font-size: 14px; }
.toolbar > .muted { margin: 0 4px 0 8px; }
.board { flex: 1; display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
.column { flex: 1 0 280px; background: var(--column); border-radius: 16px; padding: 12px; min-height: 200px; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
.column h3 { margin: 0; padding: 2px 4px 4px; min-height: 28px; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
.column h3 .side { display: flex; gap: 6px; align-items: center; }
.column h3 button { min-height: 28px; font-size: 12px; padding: 0 10px; }
.column .none { margin: 8px 4px; text-align: center; }
/* A column without tasks keeps only its header, as wide as its name, so the columns with tasks get the room. No box under it:
   an empty box looks like a place to drop cards, and tasks move by themselves. Not `.empty`: that is the empty board. */
.column.no-tasks { flex: 0 0 auto; min-width: 104px; min-height: 0; padding: 0; background: none; }
.column.no-tasks h3 { background: var(--column); border-radius: 16px; padding: 14px 14px 12px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.column.no-tasks .count { background: none; color: var(--muted); }
.count { font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px; background: var(--raised); color: var(--soft); display: inline-grid; place-items: center; padding: 0 6px; box-sizing: border-box; }
.card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; word-break: break-word; }
.card.s-finished { background: var(--done); }
.card .row { font-size: 13px; align-items: baseline; margin: 0; gap: 8px; }
.card .row a { text-decoration: none; font-weight: 700; }
.card .title { font-weight: 600; font-size: 14px; line-height: 1.35; }
.page-title { margin: 0 0 12px; font-size: 20px; font-weight: 800; }
.settings { max-width: 640px; }
.settings > .muted { margin: 0 0 8px; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 0; border-bottom: 1px solid var(--panel-line); }
.switch-row label { font-weight: 700; font-size: 15px; cursor: pointer; }
.switch-row p { margin: 2px 0 0; font-size: 13px; }
input[role="switch"] { appearance: none; flex: none; width: 44px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: var(--line); position: relative; cursor: pointer; transition: background 0.15s; }
input[role="switch"]::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; transition: transform 0.15s; }
input[role="switch"]:checked { background: var(--accent); }
input[role="switch"]:checked::after { transform: translateX(18px); }
@media (prefers-reduced-motion: reduce) { input[role="switch"], input[role="switch"]::after { transition: none; } }
.card.backlog { cursor: grab; max-width: 720px; margin: 0 0 10px; }
.card.backlog .title { font-size: 15px; }
.card.dragging { opacity: 0.4; }
.card.dropbefore { box-shadow: 0 -3px 0 var(--brand-pink); }
.card.dropafter { box-shadow: 0 3px 0 var(--brand-pink); }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
.pill i { width: 8px; height: 8px; border-radius: 50%; display: block; flex: none; }
.pill span { display: inline-block; }
.pill span::first-letter { text-transform: uppercase; }
.p-active { background: var(--active-bg); color: var(--active-fg); } .p-active i { background: var(--active-dot); }
.p-awaiting_approval { background: var(--approval-bg); color: var(--approval-fg); } .p-awaiting_approval i { background: var(--approval-dot); }
.p-blocked, .p-attention { background: var(--attn-bg); color: var(--attn-fg); } .p-blocked i, .p-attention i { background: var(--attn-dot); }
.p-waiting_external { background: var(--wait-bg); color: var(--wait-fg); } .p-waiting_external i { background: var(--wait-dot); }
.p-paused { background: var(--raised); color: var(--neutral-fg); } .p-paused i { background: var(--paused-dot); }
.p-finished { background: var(--raised); color: var(--neutral-fg); } .p-finished i { background: var(--active-dot); }
.attention-message { white-space: pre-wrap; margin: 0; font: inherit; font-size: 12px; background: var(--err-bg); border: 1px solid var(--attn-line); border-radius: 8px; padding: 8px; color: var(--fg); }
.delivery { display: flex; gap: 6px; align-items: center; justify-content: space-between; background: var(--err-bg); border: 1px solid var(--err-line); color: var(--err); border-radius: 8px; padding: 6px 8px; font-size: 12px; }
.delivery button { min-height: 28px; font-size: 12px; padding: 0 10px; }
.gone { align-self: flex-start; display: inline-block; background: var(--attn-bg); color: var(--attn-fg); border-radius: 12px; padding: 3px 10px; font-size: 12px; font-weight: 600; }
.buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.buttons button, .buttons a { min-height: 32px; font-size: 12px; padding: 0 12px; }
.buttons a { display: inline-flex; align-items: center; box-sizing: border-box; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); color: var(--fg); text-decoration: none; }
.buttons a:hover { background: var(--raised); color: var(--fg); }
.artifacts { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }
.check { font-size: 12px; color: var(--soft); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.check button { min-height: 28px; font-size: 12px; padding: 0 10px; }
.check.approval { display: block; }
.validate { font-size: 11px; font-weight: 700; color: var(--approval-fg); background: var(--approval-bg); border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
.more { position: relative; }
.more > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); font-weight: 700; letter-spacing: .1em; }
.more > summary::-webkit-details-marker { display: none; }
.more > summary:hover, .more[open] > summary { background: var(--raised); }
.more > summary:focus-visible { outline: 2px solid var(--brand-pink); outline-offset: 2px; }
.more .menu { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; min-width: 160px; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--column); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px var(--shadow); }
.more .menu button { justify-content: flex-start; border-color: transparent; background: transparent; border-radius: 8px; }
.more .menu button:hover:not(:disabled) { background: var(--raised); }
.more .menu .muted { padding: 4px 12px; }
#offline { font-size: 12px; font-weight: 700; color: var(--attn-fg); background: var(--attn-bg); border-radius: 12px; padding: 3px 10px; }
.check.approval .link { margin-left: 4px; }
.empty { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 48px 0; }
.empty .inner { max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.empty svg { width: 160px; height: 160px; }
.empty h1 { margin: 8px 0 0; font-size: 28px; font-weight: 800; line-height: 1.2; }
.empty p { margin: 0; font-size: 16px; color: var(--muted-strong); }
.empty button.primary { min-height: 48px; padding: 0 24px; border-radius: 24px; font-size: 15px; font-weight: 700; margin-top: 8px; }
.empty .link { font-size: 13px; background: none; border: 0; min-height: 0; padding: 0; }
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
#modal .box { background: var(--column); color: var(--fg); border: 1px solid var(--panel-line); border-radius: 16px; width: min(720px, 92vw); max-height: calc(100vh - 2rem); display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; box-shadow: 0 16px 48px var(--shadow); }
#modal .bar { flex: none; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--panel-line); }
#modal .bar h3 { margin: 0; font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
#modal .content { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 20px 20px; }
#modal .discard { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 20px; border-bottom: 1px solid var(--panel-line); background: var(--approval-bg); color: var(--approval-fg); font-weight: 600; }
pre { white-space: pre-wrap; border: 1px solid var(--panel-line); border-radius: 8px; padding: 10px; background: var(--panel); margin: 8px 0; }
.field { display: grid; grid-template-columns: 130px 1fr; gap: 8px; margin: 8px 0; align-items: start; }
.field > label { padding-top: 7px; font-weight: 600; color: var(--soft); }
.field input, .field select { width: 100%; box-sizing: border-box; }
.row { display: flex; gap: 6px; margin: 4px 0; align-items: center; flex-wrap: wrap; }
.field .row input[type=text] { flex: 1; width: auto; min-width: 0; }
.field input[type=checkbox] { width: auto; }
.field .hint { margin: 4px 0 0; }
#modal h4 { margin: 20px 0 4px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-strong); }
#modal h4:first-child { margin-top: 0; }
.row.marked code { text-decoration: line-through; color: var(--muted); }
.warning { margin: 4px 0 0; color: var(--err); font-size: 12px; }
.report { border: 1px solid var(--panel-line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--panel); }
.report .bad { color: var(--err); }
.report .good { color: var(--ok); font-weight: 600; }
.footer { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.card.selected { border-color: var(--brand-pink); background: color-mix(in srgb, var(--brand-pink) 10%, var(--panel)); box-shadow: 0 0 0 2px var(--brand-pink), 0 8px 24px color-mix(in srgb, var(--brand-pink) 30%, transparent); }
.card .name-link { font: inherit; font-weight: 700; color: var(--fg); background: none; border: 0; padding: 0; min-height: 0; border-radius: 4px; text-align: left; }
.card .name-link:hover { background: none; text-decoration: underline; }
.card.task { cursor: pointer; }
#detail { flex: 0 0 auto; display: flex; box-sizing: border-box; min-height: 0; background: var(--column); border-left: 1px solid var(--panel-line); }
#detail-main { width: var(--detail-w, var(--detail-auto)); box-sizing: border-box; overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
#detail-main[hidden], #detail-term[hidden] { display: none !important; }
#detail { --detail-auto: max(300px, calc(33.3vw - 30px)); --term-auto: max(300px, calc(33.3vw - 30px)); }
#detail[data-both="1"] { --detail-auto: max(260px, calc(16.65vw - 30px)); --term-auto: max(260px, calc(16.65vw - 30px)); }
.pcol { position: relative; display: flex; min-height: 0; border-left: 1px solid var(--panel-line); }
.pcol:first-child { border-left: 0; }
.pcol:not([data-open="1"]) .resizer { display: none; }
.rail-tab { flex: none; width: 30px; min-height: 0; padding: 14px 0; border: 0; border-right: 1px solid var(--panel-line); border-radius: 0; background: transparent; justify-content: flex-start; color: var(--muted-strong); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rail-tab:hover { background: var(--raised); color: var(--fg); }
.rail-tab .label { writing-mode: vertical-rl; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.rail-tab .chev { font-size: 14px; line-height: 1; }

@media (max-width: 900px) {

<script>
const TOKEN = new URLSearchParams(location.search).get("token");
const REFRESH_MS = 5000;
const DETAIL_REFRESH_MS = 3000;
const DETAIL_HASH = "#task=";
const DETAILS_KEY = "factory.details";
const REVEAL_MARGIN = 16;
const SELECTED_PREFIX = "factory.selectedTask.";
const JOB_POLL_MS = 1000;
const HIDDEN_PREFIX = "factory.hiddenColumns.";
const WORKSPACE_KEY = "factory.workspace";
const GLOBAL_API = /^\/api\/(ping|shutdown|jobs\/|workspaces|host|server-settings)/;
const ADAPTER_BUTTONS = "Needs the terminal adapter. See the banner.";
const state = { generation: 0, view: "tasks", ws: new URLSearchParams(location.search).get("ws"), workspaces: [], renaming: null, info: emptyInfo(), tasks: [], backlog: [], hidden: loadHidden(new URLSearchParams(location.search).get("ws")), pausing: new Set(), checking: new Set(), deliveryErrors: new Map(), dragging: false, dragId: null, lastKey: null, modalStart: new WeakMap(), pollFailed: false, removed: new Set(), detail: null, panel: { details: loadFlag(DETAILS_KEY, true), workspaces: loadFlag("factory.workspaces", true) } };
const byId = (id) => document.getElementById(id);
function emptyInfo() { return { columns: [], ticket_url: "", adapter: { ok: true, message: "" }, capabilities: [] }; }

function apiUrl(path) { return GLOBAL_API.test(path) ? path : `/api/w/${encodeURIComponent(state.ws)}${path.slice(4)}`; }
async function api(path, body, quiet, silent) {
  const opts = { headers: { "X-Factory-Token": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  let data;
  try {
    const r = await fetch(apiUrl(path), opts);
    data = await r.json();
    if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { data, stale: r.status === 404 && !GLOBAL_API.test(path) });
  } catch (e) {
    if (!e.stale && !silent) showError(e.message);
    throw e;
  }
  if (!quiet) hideError();
  return data;
}
function showError(text) { const e = byId("error"); e.textContent = text; e.style.display = "block"; }
function hideError() { byId("error").style.display = "none"; }
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v === null || v === undefined) continue;
    if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
function clear(node) { node.replaceChildren(); return node; }
function loadHidden(id) {
  if (!id) return [];
  try { const v = JSON.parse(localStorage.getItem(HIDDEN_PREFIX + id) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function saveHidden() {
  if (!state.ws) return;
  try { localStorage.setItem(HIDDEN_PREFIX + state.ws, JSON.stringify(state.hidden)); } catch (e) {}
}
function storedWorkspace() {
  try { return localStorage.getItem(WORKSPACE_KEY); } catch (e) { return null; }
}
function currentWorkspace() { return state.workspaces.find((w) => w.id === state.ws) || null; }
function pickWorkspace() {
  const stored = storedWorkspace();
  const found = state.workspaces.find((w) => w.id === stored) || state.workspaces[0];
  return found ? found.id : null;
}
function setWorkspace(id) {
  const switched = id !== state.ws;
  if (switched) state.detail = null;
  Object.assign(state, { generation: state.generation + 1, ws: id, hidden: loadHidden(id), pausing: new Set(), checking: new Set(), deliveryErrors: new Map(), removed: new Set(), renaming: null, info: emptyInfo(), tasks: [], backlog: [] });
  if (id) { try { localStorage.setItem(WORKSPACE_KEY, id); } catch (e) {} }
  const url = new URL(location.href);
  if (id) url.searchParams.set("ws", id); else url.searchParams.delete("ws");
  if (switched) url.hash = "";
  history.replaceState(null, "", url);
  closeModal();
  state.lastKey = null;
}
async function selectWorkspace(id) { setWorkspace(id); await refresh(true); }
function modalOpen() { return !byId("modal").hidden; }
function closeModal() { const m = byId("modal"); m.hidden = true; clear(m); m.dataset.dismissable = ""; m.dataset.busy = ""; state.lastKey = null; state.modalStart = new WeakMap(); }
function textFields(m) { return [...m.querySelectorAll("textarea, input:not([type]), input[type=text]")]; }
function showModal({ title, content, dismissable = false, headButtons = [] }) {
  const m = clear(byId("modal"));
  m.append(el("div", { class: "box" }, el("div", { class: "bar" }, el("h3", {}, title), ...headButtons), el("div", { class: "content" }, ...content)));
  m.dataset.dismissable = dismissable ? "1" : "";
  m.hidden = false;
  state.modalStart = new WeakMap(textFields(m).map((n) => [n, n.value]));
  return m;
}
function openModal(title, ...content) { return showModal({ title, content }); }
function closeButton(label = "Close") { return el("button", { onclick: closeModal }, label); }
function typedText() {
  const m = byId("modal");
  return textFields(m).some((n) => n.value !== (state.modalStart.has(n) ? state.modalStart.get(n) : n.defaultValue));
}
function askDiscard() {
  const box = byId("modal").querySelector(".box");
  if (!box || box.querySelector(".discard")) return;
  const row = el("div", { class: "discard" }, el("span", {}, "Discard the typed text?"),
    el("button", { class: "danger", onclick: closeModal }, "Discard"),
    el("button", { onclick: () => row.remove() }, "Keep editing"));
  box.querySelector(".bar").after(row);
}
let pressedOnBackdrop = false;
byId("modal").addEventListener("mousedown", (e) => { pressedOnBackdrop = e.target === byId("modal"); });
byId("modal").addEventListener("click", (e) => {
  const m = byId("modal");
  if (e.target === m && pressedOnBackdrop && m.dataset.dismissable && !m.dataset.busy) closeModal();
  pressedOnBackdrop = false;
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !modalOpen()) return;
  e.preventDefault();
  const m = byId("modal");
  if (m.dataset.busy) return;
  const discard = m.querySelector(".discard");
  if (discard) { discard.remove(); return; }
  if (m.dataset.dismissable || !typedText()) closeModal(); else askDiscard();
});
function button(label, onclick, opts = {}) {
  const b = el("button", { class: opts.cls || "", disabled: !!opts.disabled, title: opts.disabled && opts.hint ? opts.hint : null }, label);
  b.addEventListener("click", async () => {
    b.disabled = true;
    try { await onclick(); } catch (e) {}
    if (b.isConnected) b.disabled = !!opts.disabled;
  });
  return b;
}
function action(fn) { return async () => { await fn(); await refresh(true); }; }
function field(label, node) { return el("div", { class: "field" }, el("label", {}, label), node); }
function ago(iso) {
  const ms = Date.now() - Date.parse(iso);
  if (!iso || isNaN(ms)) return "";
  const min = Math.max(0, Math.floor(ms / 60000));
  if (min < 1) return "less than 1 min";
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  return h < 48 ? `${h} h` : `${Math.floor(h / 24)} d`;
}
function noteDelivery(t, data, what) {
  if (!data || !data.delivery_error) return;
  state.deliveryErrors.set(t.id, `${what} is saved, but the session did not get the message: ${data.delivery_error}`);
  state.lastKey = null;
}
function deliveryBlock(t) {
  return el("div", { class: "delivery" }, el("span", {}, state.deliveryErrors.get(t.id)),
    button("Dismiss", () => { state.deliveryErrors.delete(t.id); render(); }));
}
function renderMigration() {
  const box = byId("migration");
  const offer = state.info.library_commit;
  box.hidden = !offer;
  if (!offer) return box.replaceChildren();
  box.replaceChildren(
    el("div", {}, "The factory migrated the library. These files are not committed:"),
    el("ul", {}, ...offer.files.map((f) => el("li", {}, f))),
    el("div", {}, `Commit message: ${offer.message}`),
    button("Commit to library", action(() => api("/api/library/commit", { message: offer.message, paths: offer.paths }))));
}
function adapterDown() { return !state.info.adapter.ok; }
function can(cap) { return state.info.adapter.ok && state.info.capabilities.includes(cap); }

async function loadBoard() {
  const ws = currentWorkspace();
  if (!ws || ws.error) return null;
  const [info, tasks, backlog] = await Promise.all([api("/api/info", undefined, true), api("/api/tasks", undefined, true), api("/api/backlog", undefined, true)]);
  return { info, tasks, backlog };
}
async function refresh(force) {
  if (!force && (state.dragging || modalOpen())) return;
  const started = state.generation;
  try {
    const list = await api("/api/workspaces", undefined, true);
    if (state.generation !== started) return;
    state.workspaces = list;
    if (!currentWorkspace() && state.ws !== pickWorkspace()) setWorkspace(pickWorkspace());
    const generation = state.generation;
    const board = await loadBoard();
    if (state.generation !== generation) return;
    if (state.pollFailed) { hideError(); state.pollFailed = false; }
    byId("offline").hidden = true;
    const key = JSON.stringify([state.workspaces, state.ws, board, Math.floor(Date.now() / 60000)]);
    const changed = key !== state.lastKey;
    const { info, tasks, backlog } = board || { info: emptyInfo(), tasks: [], backlog: [] };
    for (const id of [...state.removed]) if (!tasks.some((x) => x.id === id)) state.removed.delete(id);
    Object.assign(state, { info, tasks: tasks.filter((x) => !state.removed.has(x.id)), backlog, lastKey: key });
    updateTitle();
    const reselected = ensureSelection();
    if (!reselected && state.detail && force) loadDetail();
    if ((!changed && !reselected) || modalOpen() || state.dragging || (!force && menuOpen())) return;
  } catch (e) { if (!e.stale) { state.pollFailed = true; byId("offline").hidden = false; } return; }
  render();
}
function needsYou(t) { return t.attention || t.status === "blocked" || t.status === "awaiting_approval"; }
const PAGE_TITLE = "CAPTN Factory";
function updateTitle() {
  const n = state.tasks.filter((t) => !state.removed.has(t.id) && needsYou(t)).length;
  document.title = n ? `(${n}) ${PAGE_TITLE}` : PAGE_TITLE;
}
function menuOpen() { return !!document.querySelector("details.more[open]"); }
function closeMenus(except) { for (const d of document.querySelectorAll("details.more[open]")) if (d !== except) d.open = false; }
document.addEventListener("click", (e) => closeMenus(e.target.closest && e.target.closest("details.more")));
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || modalOpen() || !menuOpen()) return;
  e.preventDefault();
  const open = document.querySelector("details.more[open]");
  closeMenus();
  open.querySelector("summary").focus();
});
function render() {
  updateTitle();
  const banner = byId("banner");
  banner.hidden = !adapterDown();
  banner.textContent = adapterDown() ? state.info.adapter.message : "";
  renderMigration();
  for (const view of ["tasks", "backlog", "settings"]) {
    const tab = byId("tab-" + view);
    tab.classList.toggle("on", state.view === view);
    if (state.view === view) tab.setAttribute("aria-current", "page"); else tab.removeAttribute("aria-current");
  }
  byId("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  renderSidebar();
  byId("lcol-ws").hidden = state.view !== "tasks";
  const main = byId("main");
  const oldBoard = main.querySelector(".board");
  const left = oldBoard ? oldBoard.scrollLeft : 0;
  const top = main.scrollTop;
  clear(main).append(mainView());
  const board = main.querySelector(".board");
  if (board) board.scrollLeft = left;
  main.scrollTop = top;
  renderDetail();
}

function mainView() {
  const ws = currentWorkspace();
  if (!ws) return el("div", {}, el("p", { class: "muted" }, "No workspace. Click + to add a factory."));

  if (name) name.focus();
}
function updateRail() {
  for (const [tabId, open, label] of [["details-tab", state.panel.details, "details"], ["term-tab", state.term.open, "terminal"]]) {
    const tab = byId(tabId);

}
async function loadDetail() {
  const d = state.detail;
  if (!d) return;
  let data;
  try { data = await api(`/api/tasks/${d.id}/detail`, undefined, true); } catch (e) { return; }
  if (state.detail !== d) return;
  const key = JSON.stringify([data, Math.floor(Date.now() / 60000)]);

function eventTime(iso) {

}
/** Fields the timeline does not show: the header already has the description, the label carries the column move, and run_in says nothing to the reader. */
const EVENT_HIDDEN_FIELDS = { task_created: ["description"], step_started: ["run_in"], column_changed: ["from", "to"], task_unblocked: ["reason"] };
const NOT_A_STEP = "(finished)";
function eventLabel(ev) {

}

  for (const [k, v] of Object.entries(ev)) {

function stepsSection(d) {
  const list = el("ol", { class: "steps" });

    if (s.state === "current") name.append(el("span", { class: "now" }, "now" + loopText(d.data.row)));

}
function durationText(ms) {

/** Oldest first in, newest first out. A step that starts and ends in the same second (like create-worktree) keeps only its "Step done" line; other "Step done" lines get the step's duration. */

function timelineSection(d) {

    const what = el("span", {}, el("span", { class: "what" }, eventLabel(ev)), ev.step && ev.step !== NOT_A_STEP ? el("span", { class: "muted" }, " · " + ev.step) : "");
    if (extra) what.append(el("span", { class: "extra" }, extra));
    list.append(el("li", { class: EVENT_TONES[ev.type] || "" }, el("time", { datetime: ev.ts, title: new Date(ev.ts).toLocaleString() }, eventTime(ev.ts)), el("i", { "aria-hidden": "true" }), what));
  }

  box.append(evs.length ? list : el("div", { class: "muted" }, "No events yet."));

}
function factRow(dl, label, value) {

}
function longValue(v) {
  const text = typeof v === "string" ? v : JSON.stringify(v, null, 2);
  if (text.length <= 120 && !text.includes("\n")) return el("code", {}, text);
  return el("details", {}, el("summary", {}, `${text.split("\n")[0].slice(0, 60)}…`), el("pre", {}, text));
}
function infoSection(d) {
  const row = d.data.row, info = d.data.info;
  const dl = el("dl", { class: "facts" });
  factRow(dl, "Pipeline", row.pipeline);
  factRow(dl, "Ticket", ticketNode(row));
  if (row.mr_url && /^https?:/.test(row.mr_url)) factRow(dl, "MR", el("a", { href: row.mr_url, target: "_blank", rel: "noopener" }, row.mr_url));
  factRow(dl, "Branch", info.branch && el("code", {}, info.branch));

  factRow(dl, "Worktree", info.worktree && el("code", {}, info.worktree));

  if (row.artifacts.length) {
    const list = el("div", { class: "artifacts" });
    for (const name of row.artifacts) list.append(el("span", { class: "link", tabindex: "0", onclick: () => openArtifact(row.id, name).catch(() => {}) }, name));

function renderDetail() {
  const d = state.detail;
  const showDetails = !!d && state.panel.details;

  byId("detail-main").hidden = !showDetails;
  byId("pcol-details").dataset.open = showDetails ? "1" : "";
  byId("detail").dataset.open = showDetails || (!!d && state.term.open) ? "1" : "";
  byId("detail").dataset.both = showDetails && !!d && state.term.open ? "1" : "";

  renderTerminalShell();
  const aside = byId("detail-main");
  if (!showDetails) { clear(aside); return; }
  const scroll = aside.scrollTop;
  const openValues = new Set([...aside.querySelectorAll(".facts details[open] summary")].map((n) => n.textContent));
  const row = (d.data && d.data.row) || state.tasks.find((x) => x.id === d.id);
  const names = el("div", { class: "names" });
  if (row) {
    const ticket = ticketNode(row);
    if (ticket) names.append(el("span", { class: "ticket" }, ticket));
    names.append(el("h2", {}, row.display_name), row.display_name !== row.id ? el("span", { class: "muted" }, row.id) : "");
  } else names.append(el("h2", {}, d.id));
  clear(aside).append(el("div", { class: "dhead" }, names));
  if (!row) return;
  aside.append(el("p", { class: "desc" }, row.description), el("div", { class: "pills" }, ...statusPills(row)));
  if (row.attention && row.attention.message) aside.append(el("pre", { class: "attention-message" }, row.attention.message));
  if (row.status_reason) aside.append(el("div", { class: "muted" }, row.status_reason));
  if (row.session_state === "gone" && row.status !== "paused" && row.status !== "finished") aside.append(el("div", { class: "gone" }, "Session gone"));
  if (state.deliveryErrors.has(row.id)) aside.append(deliveryBlock(row));
  if (row.approval) aside.append(approvalBlock(row));
  if (row.status === "waiting_external" && row.wait_has_check) aside.append(checkBlock(row));
  aside.append(taskButtons(row));
  if (!d.data) { aside.append(el("div", { class: "muted" }, "Loading…")); return; }
  aside.append(stepsSection(d), infoSection(d), timelineSection(d));
  for (const s of aside.querySelectorAll(".facts details summary")) if (openValues.has(s.textContent)) s.parentElement.open = true;

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.defaultPrevented || modalOpen() || menuOpen() || !state.detail || !state.panel.details) return;
  if (e.target.closest && e.target.closest("#detail-term")) return;
  closeDetails();
});
window.addEventListener("hashchange", () => { const id = detailHashId(); if (id && state.tasks.some((x) => x.id === id)) selectTask(id); });
setInterval(() => { if (state.detail && state.panel.details && !document.hidden) loadDetail(); }, DETAIL_REFRESH_MS);

const TERM_KEY = "factory.terminal";
const LIVE_INPUT_MAX = 8000;
const LIVE_FIT_DELAY_MS = 150;
const LIVE_THEME = {
  background: "#0E0908", foreground: "#E6DFDC", cursor: "#FF5AA5", cursorAccent: "#0E0908", selectionBackground: "#67388899",
  black: "#2E2322", red: "#FF6B6B", green: "#7CC63A", yellow: "#FECD40", blue: "#6CA8FF", magenta: "#D58BFF", cyan: "#4FD1C5", white: "#E6DFDC",
  brightBlack: "#7A6E6A", brightRed: "#FF8A8A", brightGreen: "#A8E07F", brightYellow: "#FFE07A", brightBlue: "#9CC4FF", brightMagenta: "#E5B3FF", brightCyan: "#81E6D9", brightWhite: "#FFFFFF",
};
state.term = { open: loadFlag(TERM_KEY, false) };
function renderTerminalShell() {
  const aside = byId("detail");
  const show = !!state.detail && state.term.open;
  if (show && state.live.id !== state.detail.id) startLive();
  if (!show && state.live.id) stopLive();
  byId("detail-term").hidden = !show;
  byId("pcol-term").dataset.open = show ? "1" : "";
  aside.dataset.term = show ? "1" : "";
  const row = state.detail && state.tasks.find((x) => x.id === state.detail.id);
  byId("term-task").textContent = row ? `· ${row.display_name}` : "";
}
function setTermStatus(live, text) {
  const status = document.querySelector("#detail-term .tstatus");
  status.classList.toggle("live", live);
  status.querySelector(".tstatus-text").textContent = text;
}

state.live = { id: null, term: null, fit: null, abort: null, observer: null, queue: "", sending: false, connected: false, size: "", fitTimer: null };
let xtermLoading = null;
function loadXterm() {
  if (window.Terminal && window.FitAddon) return Promise.resolve();
  const load = (tag, attrs) => new Promise((ok, ko) => document.head.append(el(tag, { ...attrs, onload: ok, onerror: () => ko(new Error("Could not load the terminal component.")) })));
  if (!xtermLoading) {
    xtermLoading = Promise.all([load("link", { rel: "stylesheet", href: "/static/xterm.css" }), load("script", { src: "/static/xterm.js" })])
      .then(() => load("script", { src: "/static/addon-fit.js" }))
      .catch((e) => { xtermLoading = null; throw e; });
  }
  return xtermLoading;
}
function liveEnded(reason) {
  const L = state.live;
  L.connected = false;
  setTermStatus(false, reason);
  byId("term-reconnect").hidden = false;
}
async function startLive() {
  const d = state.detail, L = state.live;
  stopLive();
  L.id = d.id;
  byId("term-reconnect").hidden = true;
  setTermStatus(false, "Connecting…");
  try { await loadXterm(); } catch (e) { return liveEnded(e.message); }

  term.loadAddon(fit);
  term.open(clear(byId("live-host")));
  fit.fit();
  Object.assign(L, { term, fit, size: `${term.cols}x${term.rows}` });
  term.onData(queueLive);
  L.observer = new ResizeObserver(scheduleFit);
  L.observer.observe(byId("live-host"));
  try {
    await api(`/api/tasks/${d.id}/attach`, { cols: term.cols, rows: term.rows }, true);
  } catch (e) {
    term.write(`\r\n${e.message}\r\n`);
    return liveEnded("Not live");
  }

}
async function streamLive(id, term) {
  const L = state.live, ctrl = new AbortController();

  } catch (e) { if (!ctrl.signal.aborted) liveEnded("The connection failed."); return; }

      for (let nl = pending.indexOf("\n"); nl >= 0; nl = pending.indexOf("\n")) {
        const msg = JSON.parse(pending.slice(0, nl));
        pending = pending.slice(nl + 1);
        if (msg.d) term.write(Uint8Array.from(atob(msg.d), (c) => c.charCodeAt(0)));
        if (msg.closed) return liveEnded("The session terminal ended.");

  if (!L.sending) flushLive();
}
/** Keys go out in order, one request at a time; keys typed meanwhile wait in the queue and leave together. */

  while (L.queue && L.id === id) {
    const data = L.queue.slice(0, LIVE_INPUT_MAX);
    L.queue = L.queue.slice(data.length);

    L.fit.fit();
    const size = `${L.term.cols}x${L.term.rows}`;

const WIDTH_STEP = 16;
const PANES = {
  "resize-detail": { key: "factory.detailWidth", prop: "--detail-w", host: () => byId("detail"), target: () => byId("detail-main"), side: "right", min: 260, max: () => Math.min(900, window.innerWidth * 0.6) },
  "resize-term": { key: "factory.terminalWidth", prop: "--term-w", host: () => byId("detail"), target: () => byId("detail-term"), side: "right", min: 260, max: () => Math.min(1400, window.innerWidth * 0.7) },
  "resize-ws": { key: "factory.workspacesWidth", prop: "--ws-w", host: () => byId("lcol-ws"), target: () => byId("sidebar"), side: "left", min: 160, max: () => Math.min(480, window.innerWidth * 0.35) },
};
/** A pane on the right grows when its handle moves left; the workspace pane on the left grows when it moves right. */
function grownBy(pane, dx) { return pane.side === "right" ? -dx : dx; }
function clampWidth(pane, w) { return Math.round(Math.max(pane.min, Math.min(pane.max(), w))); }
function setPaneWidth(pane, w, save) {
  const width = clampWidth(pane, w);
  pane.host().style.setProperty(pane.prop, `${width}px`);
  if (save) { try { localStorage.setItem(pane.key, String(width)); } catch (e) {} }
  return width;
}
function restorePaneWidths() {
  for (const pane of Object.values(PANES)) {
    let saved = null;
    try { saved = Number(localStorage.getItem(pane.key)); } catch (e) {}
    if (saved) setPaneWidth(pane, saved, false);
  }
}
for (const [id, pane] of Object.entries(PANES)) {
  const handle = byId(id);
  handle.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const startX = e.clientX, startW = pane.target().getBoundingClientRect().width;
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("active");
    document.body.classList.add("resizing");
    const move = (ev) => setPaneWidth(pane, startW + grownBy(pane, ev.clientX - startX), false);
    const up = (ev) => {
      setPaneWidth(pane, startW + grownBy(pane, ev.clientX - startX), true);
      handle.removeEventListener("pointermove", move);
      handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
      handle.classList.remove("active");
      document.body.classList.remove("resizing");
    };
    handle.addEventListener("pointermove", move);
    handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
  handle.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const now = pane.target().getBoundingClientRect().width;
    setPaneWidth(pane, now + grownBy(pane, e.key === "ArrowRight" ? WIDTH_STEP : -WIDTH_STEP), true);
  });
  handle.addEventListener("dblclick", () => {
    pane.host().style.removeProperty(pane.prop);
    try { localStorage.removeItem(pane.key); } catch (e) {}
  });
}
byId("details-tab").addEventListener("click", () => setPanelOpen("details", !state.panel.details));
byId("term-tab").addEventListener("click", () => setPanelOpen("terminal", !state.term.open));
restorePaneWidths();
byId("ws-tab").addEventListener("click", () => setWorkspacesOpen(!state.panel.workspaces));
renderWorkspacePanel();
byId("term-reconnect").addEventListener("click", () => { stopLive(); renderTerminalShell(); });
function setView(view) { state.view = view; render(); }
byId("tab-tasks").addEventListener("click", () => setView("tasks"));
byId("tab-backlog").addEventListener("click", () => setView("backlog"));
byId("tab-settings").addEventListener("click", () => setView("settings"));
refresh(true);
setInterval(refresh, REFRESH_MS);
setInterval(() => { for (const n of document.querySelectorAll("[data-next-check]")) n.textContent = countdownText(n.dataset.nextCheck); }, 1000);
