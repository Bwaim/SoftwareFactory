.pill span { display: inline-block; }

.delivery button { min-height: 28px; font-size: 12px; padding: 0 10px; }

.buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

.buttons a:hover { background: var(--raised); color: var(--fg); }
.artifacts { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; }
.check { font-size: 12px; color: var(--soft); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.check button { min-height: 28px; font-size: 12px; padding: 0 10px; }
.check.approval { display: block; }
.validate { font-size: 11px; font-weight: 700; color: var(--approval-fg); background: var(--approval-bg); border-radius: 8px; padding: 1px 6px; margin-left: 4px; }
.more { position: relative; }

.more > summary::-webkit-details-marker { display: none; }
.more > summary:hover, .more[open] > summary { background: var(--raised); }
.more > summary:focus-visible { outline: 2px solid var(--brand-pink); outline-offset: 2px; }
.more .menu { position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; min-width: 160px; display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--column); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px var(--shadow); }
.more .menu button { justify-content: flex-start; border-color: transparent; background: transparent; border-radius: 8px; }
.more .menu button:hover:not(:disabled) { background: var(--raised); }
.more .menu .muted { padding: 4px 12px; }
.theme-toggle { width: 36px; padding: 0; border-radius: 50%; background: transparent; }
.theme-toggle svg { width: 18px; height: 18px; }
:root:not([data-theme="light"]) .theme-toggle .moon, :root[data-theme="light"] .theme-toggle .sun { display: none; }
#offline { font-size: 12px; font-weight: 700; color: var(--attn-fg); background: var(--attn-bg); border-radius: 12px; padding: 3px 10px; }
.check.approval .link { margin-left: 4px; }
.empty { min-height: 60vh; display: flex; align-items: center; justify-content: center; padding: 48px 0; }
.empty .inner { max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.empty svg { width: 160px; height: 160px; }
.empty h1 { margin: 8px 0 0; font-size: 28px; font-weight: 800; line-height: 1.2; }
.empty p { margin: 0; font-size: 16px; color: var(--muted-strong); }
.empty button.primary { min-height: 48px; padding: 0 24px; border-radius: 24px; font-size: 15px; font-weight: 700; margin-top: 8px; }
.empty .link { font-size: 13px; background: none; border: 0; min-height: 0; padding: 0; }
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 10; }
#modal .box { background: var(--column); color: var(--fg); border: 1px solid var(--panel-line); border-radius: 16px; width: min(720px, 92vw); max-height: calc(100vh - 2rem); display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; box-shadow: 0 16px 48px var(--shadow); }
#modal .bar { flex: none; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--panel-line); }
#modal .bar h3 { margin: 0; font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
#modal .content { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 16px 20px 20px; }
#modal .discard { display: flex; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 20px; border-bottom: 1px solid var(--panel-line); background: var(--approval-bg); color: var(--approval-fg); font-weight: 600; }
pre { white-space: pre-wrap; border: 1px solid var(--panel-line); border-radius: 8px; padding: 10px; background: var(--panel); margin: 8px 0; }
.field { display: grid; grid-template-columns: 130px 1fr; gap: 8px; margin: 8px 0; align-items: start; }
.field > label { padding-top: 7px; font-weight: 600; color: var(--soft); }
.field input, .field select { width: 100%; box-sizing: border-box; }
.row { display: flex; gap: 6px; margin: 4px 0; align-items: center; flex-wrap: wrap; }
.report { border: 1px solid var(--panel-line); border-radius: 12px; padding: 10px 12px; margin: 8px 0; background: var(--panel); }
.report .bad { color: var(--err); }

.footer { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.card.selected { border-color: var(--brand-pink); box-shadow: 0 0 0 1px var(--brand-pink); }
.card .name-link { font: inherit; font-weight: 700; color: var(--fg); background: none; border: 0; padding: 0; min-height: 0; border-radius: 4px; text-align: left; }
.card .name-link:hover { background: none; text-decoration: underline; }
.card.task { cursor: pointer; }
#detail { flex: 0 0 480px; max-width: 480px; box-sizing: border-box; position: sticky; top: 0; height: 100vh; overflow: auto; background: var(--column); border-left: 1px solid var(--panel-line); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
#detail .dhead { display: flex; gap: 8px; align-items: flex-start; }
#detail .dhead .names { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
#detail .dhead .ticket { font-size: 13px; font-weight: 700; }
#detail h2 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
#detail .close { width: 36px; padding: 0; border-radius: 50%; flex: none; font-size: 16px; }
#detail .desc { margin: 0; font-size: 15px; font-weight: 600; }
#detail .pills { display: flex; gap: 6px; flex-wrap: wrap; }
#detail section { border-top: 1px solid var(--panel-line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
#detail section h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted-strong); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
#detail section h3 .muted { text-transform: none; letter-spacing: 0; font-weight: 500; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.steps li { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; position: relative; }
.steps li::before { content: ""; position: absolute; left: 7px; top: 20px; bottom: -6px; width: 2px; background: var(--panel-line); }
.steps li:last-child::before { display: none; }
.steps .mark { width: 16px; height: 16px; border-radius: 50%; flex: none; margin-top: 2px; box-sizing: border-box; border: 2px solid var(--line); background: var(--column); position: relative; z-index: 1; display: grid; place-items: center; }
.steps .done .mark { background: var(--active-dot); border-color: var(--active-dot); }

.steps .current .mark { border-color: var(--brand-pink); background: var(--brand-pink); box-shadow: 0 0 0 4px var(--attn-bg); }
.steps .done .sname { color: var(--muted); }
.steps .current .sname { font-weight: 700; }
.steps .sname { overflow-wrap: anywhere; }
.steps .parent { color: var(--muted); }
.steps .now { font-size: 11px; font-weight: 700; color: var(--attn-fg); background: var(--attn-bg); border-radius: 8px; padding: 1px 6px; margin-left: 6px; white-space: nowrap; }
.terminal { margin: 0; max-height: 360px; overflow: auto; background: #0E0908; color: #E6DFDC; border: 1px solid #2E2322; border-radius: 8px; padding: 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--active-dot); display: block; }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }

.timeline time { font-size: 12px; line-height: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.timeline i { width: 8px; height: 8px; border-radius: 50%; background: var(--paused-dot); display: block; margin-top: 6px; }
.timeline .ok i { background: var(--active-dot); }
.timeline .bad i { background: var(--attn-dot); }
.timeline .wait i { background: var(--approval-dot); }
.timeline .what { font-weight: 600; }
.timeline li > span { line-height: 20px; }
.timeline .extra { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap; }
.facts { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
.facts details summary { cursor: pointer; color: var(--link); font-weight: 600; }
.facts details pre { margin: 6px 0 0; font-size: 12px; }
@media (max-width: 900px) {
  #detail { position: fixed; inset: 0; z-index: 15; max-width: none; height: auto; border-left: 0; }
}
@media (max-width: 600px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .field { grid-template-columns: 1fr; }
  .field > label { padding-top: 0; }
}
</style>
</head>

<header>

<script>

let pressedOnBackdrop = false;
byId("modal").addEventListener("mousedown", (e) => { pressedOnBackdrop = e.target === byId("modal"); });
byId("modal").addEventListener("click", (e) => {

document.addEventListener("keydown", (e) => {

});
function button(label, onclick, opts = {}) {

}
function action(fn) { return async () => { await fn(); await refresh(true); }; }
function field(label, node) { return el("div", { class: "field" }, el("label", {}, label), node); }

function noteDelivery(t, data, what) {

}

async function refresh(force) {

function needsYou(t) { return t.attention || t.status === "blocked" || t.status === "awaiting_approval"; }

function menuOpen() { return !!document.querySelector("details.more[open]"); }

document.addEventListener("click", (e) => closeMenus(e.target.closest && e.target.closest("details.more")));
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || modalOpen() || !menuOpen()) return;

function render() {

  byId("tab-backlog").classList.toggle("on", state.view === "backlog");

  const oldBoard = main.querySelector(".board");

  if (board) board.scrollLeft = left;

}

function allColumns() { return [...state.info.columns, "Done"]; }
function columnOf(t) {

}
function launchButton(label) { return button(label, () => openLaunch({}), { cls: "primary launch", disabled: adapterDown(), hint: ADAPTER_BUTTONS }); }
function emptyBoard() {
  const node = byId("empty-board").content.firstElementChild.cloneNode(true);

  node.querySelector(".link").addEventListener("click", () => setView("backlog"));

}
function tasksView() {
  const root = el("div");
  if (!state.tasks.some((x) => !state.removed.has(x.id))) { root.append(emptyBoard()); return root; }
  const toolbar = el("div", { class: "toolbar" });
  toolbar.append(launchButton("Launch"), el("span", { class: "muted" }, "Columns"));
  for (const name of allColumns()) {
    const off = state.hidden.includes(name);
    toolbar.append(button(name, () => toggleColumn(name), { cls: "toggle" + (off ? " off" : "") }));
  }
  const board = el("div", { class: "board" });
  for (const name of allColumns()) {
    if (state.hidden.includes(name)) continue;
    const tasks = state.tasks.filter((x) => !state.removed.has(x.id) && columnOf(x) === name);
    const side = el("span", { class: "side" }, el("span", { class: "count" }, tasks.length));
    if (name === "Done") side.append(button("Clean", openClean));
    const head = el("h3", {}, el("span", {}, name), side);
    const col = el("section", { class: "column", "aria-label": name }, head);
    for (const t of tasks) col.append(taskCard(t));

  }

}
function toggleColumn(name) {
  state.hidden = state.hidden.includes(name) ? state.hidden.filter((n) => n !== name) : [...state.hidden, name];
  saveHidden();
  render();
}
function ticketNode(t) {
  const url = state.info.ticket_url;
  if (!t.ticket) return null;
  if (url && /^https?:/.test(url)) return el("a", { href: url.replace("{key}", encodeURIComponent(t.ticket)), target: "_blank", rel: "noopener" }, t.ticket);
  return el("strong", {}, t.ticket);
}
function approvalArtifact(t) {
  const a = t.approval;
  const base = a.artifact ? String(a.artifact).split("/").pop() : "";
  return [base, a.artifact_key, a.artifact_key + ".md"].find((n) => n && t.artifacts.includes(n)) || null;
}
function loopText(t) { return t.loop ? ` · loop ${t.loop.n} of ${t.loop.max}` : ""; }

}
function lastCheckText(c) {

}
function checkBlock(t) {
  const box = el("div", { class: "check" });
  if (t.next_check_at) box.append(el("div", { "data-next-check": t.next_check_at }, countdownText(t.next_check_at)));
  if (t.last_check) box.append(el("div", { class: "muted" }, `Last check: ${new Date(t.last_check.at).toLocaleTimeString()}, ${lastCheckText(t.last_check)}`));
  return box;
}
async function checkNow(t) {
  state.checking.add(t.id);
  render();
  try {
    const res = await api(`/api/tasks/${t.id}/check`, {});
    const job = await waitJob(res.job);
    if (job.status === "done" && job.result.error && job.result.error !== "The task does not wait on a done check.") showError(job.result.error);
  } finally {
    state.checking.delete(t.id);

function pill(kind, text) { return el("span", { class: "pill p-" + kind }, el("i", { "aria-hidden": "true" }), el("span", {}, text)); }
function statusPills(t) {

  const label = t.status.replace("_", " ");
  if (!(t.attention && t.status === "active")) pills.push(pill(t.status, `${label}${since && t.status !== "finished" ? " for " + since : ""}`));
  if (t.attention) {

  }

}
function taskCard(t) {

  if (t.display_name !== t.id) top.append(el("span", { class: "muted" }, t.id));
  card.append(top, el("div", { class: "title" }, t.description), el("div", { class: "muted" }, `${t.pipeline} › ${t.step}${loopText(t)}`));

}
function approvalBlock(t) {
  const box = el("div", { class: "check approval" }, "To validate: ");

  }

  }

    const menu = el("div", { class: "menu" });

    if (!paused && live && !state.pausing.has(t.id)) menu.append(button("Pause", () => openPause(t), { disabled: down, hint: ADAPTER_BUTTONS }));
    menu.append(button("Cancel", () => openCancel(t), { cls: "danger" }));
    for (const b of menu.querySelectorAll("button")) b.addEventListener("click", () => { const d = b.closest("details"); if (d) d.open = false; });
    row.append(el("details", { class: "more" }, el("summary", { "aria-label": `More actions for ${t.display_name}`, title: "More actions" }, "⋯"), menu));
  }
  return row;
}
async function openCancel(t) {
  const out = el("div", {}, "Loading…");
  const keep = closeButton("Keep task");
  const go = el("button", { class: "danger", disabled: true }, "Cancel task");

  const busy = (on) => { keep.disabled = on; go.disabled = on; go.textContent = on ? "Cancelling…" : "Cancel task"; m.dataset.busy = on ? "1" : ""; };
  const failure = (text) => out.replaceChildren(el("div", { class: "report" }, el("pre", { class: "bad" }, text)));
  try {
    const plan = await api(`/api/tasks/${t.id}/cancel/dry-run`, {});
    out.replaceChildren(el("pre", {}, plan.text));
    go.disabled = false;
  } catch (e) { failure(e.message); }
  go.addEventListener("click", async () => {
    busy(true);
    try {
      await api(`/api/tasks/${t.id}/cancel`, {});
      state.removed.add(t.id);
      closeModal();
      render();
    } catch (e) {
      if (e.data && e.data.archived) {
        state.removed.add(t.id);
        failure(e.message);
        busy(false);
        keep.disabled = false;

}
async function focusTask(t) {
  const res = await api(`/api/tasks/${t.id}/focus`, {});
  if (res.front === "ask") openTerminalApp(t);
  if (res.front === "failed") { state.deliveryErrors.set(t.id, `Focused in Herdr. Could not bring ${res.app} to the front: ${res.message}`); state.lastKey = null; render(); }
}
function openTerminalApp(t) {
  const name = el("input", { placeholder: "Ghostty" });
  openModal("Terminal app", el("p", {}, "Which terminal app shows Herdr? Leave it empty to never ask again."), name,
    el("div", { class: "footer" }, closeButton("Cancel"), button("Save", async () => {
      await api("/api/config/set", { step: "terminal", key: "terminal_app", value: name.value.trim() });
      closeModal();

    }, { cls: "primary" })));
}
async function openArtifact(tid, name) {

function openRequestChanges(t) {

    button("Send", async () => { noteDelivery(t, await api(`/api/tasks/${t.id}/request-changes`, { text: text.value }), "The change request"); closeModal(); await refresh(true); }, { cls: "primary" })));
}
async function waitJob(id) {

async function runJob(tid, path, body) {

}
function choice(title, question, options) {
