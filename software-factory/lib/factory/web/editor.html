<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline editor</title>
<style>
:root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --err: #c62828; --warn: #b26a00; --accent: #0a62c9; --panel: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f7; --muted: #a1a1a6; --line: #3a3a3c; --err: #ff6b6b; --warn: #ffb74d; --accent: #64a8ff; --panel: #1f1f22; } }
body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center; }
main { display: grid; grid-template-columns: 320px 1fr 360px; gap: 16px; padding: 16px; align-items: start; }
[hidden] { display: none !important; }
section { min-width: 0; }
h3 { margin: 0 0 8px; }
input, select, button, textarea { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0; background: var(--panel); cursor: grab; }
.card.clickable { cursor: pointer; }
.muted { color: var(--muted); font-size: 12px; }
#error { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--err); color: white; padding: 8px 16px; }
.problem.error { color: var(--err); }
.problem.warning { color: var(--warn); }
#pipeline { min-height: 200px; border: 2px dashed var(--line); border-radius: 8px; padding: 8px; margin: 8px 0; }
#pipeline.over { border-color: var(--accent); }
pre { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--panel); }
.field { display: grid; grid-template-columns: 110px 1fr; gap: 8px; margin: 6px 0; align-items: center; }
.row { display: flex; gap: 6px; margin: 4px 0; align-items: center; }
.row input { flex: 1; min-width: 0; }
.head { display: flex; gap: 8px; align-items: center; cursor: grab; }
.head .grow { flex: 1; }
.link { color: var(--accent); cursor: pointer; text-decoration: underline; }
.start { padding: 16px; border-bottom: 1px solid var(--line); }
.start .row { margin: 8px 0; }
dl { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; margin: 8px 0; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.dim { opacity: 0.5; }
.tag { border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; font-size: 11px; color: var(--muted); margin-right: 4px; }
#stepform { position: fixed; inset: 0; background: var(--bg); overflow: auto; padding: 16px; z-index: 10; }
.formgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
#stepform textarea { width: 100%; min-height: 280px; box-sizing: border-box; font-family: ui-monospace, monospace; }
.formside { position: sticky; top: 0; }
</style>
</head>
<body>
<div id="error"></div>
<header><strong>Pipeline editor</strong><span id="title" class="muted"></span></header>
<section id="start" class="start" hidden></section>
<main id="editor" hidden>
  <section>
    <h3>Available steps</h3>
    <div class="row"><button type="button" id="newstep">New step</button></div>
    <div id="filters" class="row"></div>
    <div id="available"></div>
  </section>
  <section>
    <h3>Pipeline</h3>
    <div id="form"></div>
    <div id="pipeline"></div>
    <div id="problems"></div>
    <div id="save"></div>
  </section>
  <section>
    <h3>Step detail</h3>
    <div id="detail" class="muted">Click a step.</div>
  </section>
</main>
<div id="stepform" hidden></div>
<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get("token");
const CHECK_DELAY_MS = 300;
const SHOW_HIDDEN_KEY = "factory-editor-show-hidden";
const KEY_TYPES = ["text", "long-text", "file"];
function readShowHidden() { try { return localStorage.getItem(SHOW_HIDDEN_KEY) === "1"; } catch (e) { return false; } }
function saveShowHidden(value) { try { localStorage.setItem(SHOW_HIDDEN_KEY, value ? "1" : "0"); } catch (e) {} }
const state = { steps: [], columns: [], pipelines: [], loadedLevel: null, saveLevel: "local", model: null, checkTimer: null, checkCount: 0, hasError: true, commit: null, savedPath: null, original: null, confirmReplace: false, showHidden: readShowHidden() };
const byId = (id) => document.getElementById(id);

async function api(path, body) {
  const opts = { headers: { "X-Factory-Token": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const data = await r.json();
  if (r.status === 409) { const conflict = new Error(data.error); conflict.conflict = true; throw conflict; }
  if (!r.ok) { showError(data.error || r.statusText); throw new Error(data.error || r.statusText); }
  hideError();
  return data;
}
function showError(text) { const e = byId("error"); e.textContent = text; e.style.display = "block"; }
function hideError() { byId("error").style.display = "none"; }
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v); }
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
function clear(node) { node.replaceChildren(); return node; }
function guard(fn) { return (...a) => fn(...a).catch(() => {}); }

function emptyModel() {
  return { id: "", description: "", model: "", effort: "", start_column: "", inputs: [], steps: [], extra: {} };
}
function entryOf(raw) {
  const e = typeof raw === "string" ? { id: raw } : raw || {};
  return { id: e.id || "", model: e.model || "", effort: e.effort || "", column: e.column || "",
    with: Object.entries(e.with || {}).map(([key, value]) => ({ key, value: typeof value === "string" ? value : JSON.stringify(value) })), open: false };
}
function modelOf(data) {
  const claude = data.claude || {};
  const known = new Set(["id", "description", "claude", "start_column", "inputs", "steps"]);
  const extra = Object.fromEntries(Object.entries(data).filter(([k]) => !known.has(k) && !k.startsWith("_")));
  return { id: data.id || "", description: data.description || "", model: claude.model || "", effort: claude.effort || "",
    start_column: data.start_column || "",
    inputs: Object.entries(data.inputs || {}).map(([key, v]) => ({ key, type: (v && v.type) || "text", description: (v && v.description) || "" })),
    steps: (data.steps || []).map(entryOf), extra };
}
function parseValue(text) {
  try { const v = JSON.parse(text); if (typeof v !== "string") return v; } catch (e) {}
  return text;
}
function dataOf(m) {
  const data = { ...m.extra, id: m.id, description: m.description, claude: { model: m.model, effort: m.effort },
    start_column: m.start_column, inputs: {}, steps: [] };
  for (const r of m.inputs) if (r.key) data.inputs[r.key] = { type: r.type, description: r.description };
  for (const s of m.steps) {
    const w = {};
    for (const r of s.with) if (r.key) w[r.key] = parseValue(r.value);
    data.steps.push({ id: s.id, with: w, model: s.model, effort: s.effort, column: s.column });
  }
  return data;
}

function field(label, node) { return el("div", { class: "field" }, el("label", {}, label), node); }
function textInput(value, onChange, placeholder = "") {
  const i = el("input", { type: "text", placeholder });
  i.value = value;
  i.addEventListener("input", () => onChange(i.value));
  return i;
}
function selectInput(options, value, onChange) {
  const s = el("select");
  for (const o of options) s.append(el("option", { value: o }, o || "(none)"));
  s.value = value;
  s.addEventListener("change", () => onChange(s.value));
  return s;
}
function pairRows(rows, keyName, valueName, keyHint, valueHint) {
  const box = el("div");
  const draw = () => {
    clear(box);
    rows.forEach((r, i) => {
      box.append(el("div", { class: "row" },
        textInput(r[keyName], (v) => { r[keyName] = v; changed(); }, keyHint),
        textInput(r[valueName], (v) => { r[valueName] = v; changed(); }, valueHint),
        el("button", { type: "button", onclick: () => { rows.splice(i, 1); draw(); changed(); } }, "Remove")));
    });
    box.append(el("button", { type: "button", onclick: () => { rows.push({ [keyName]: "", [valueName]: "" }); draw(); } }, "Add"));
  };
  draw();
  return box;
}

function inputRows(rows) {
  const box = el("div");
  const draw = () => {
    clear(box);
    rows.forEach((r, i) => box.append(el("div", { class: "row" },
      textInput(r.key, (v) => { r.key = v; changed(); }, "key"),
      selectInput(KEY_TYPES, r.type || "text", (v) => { r.type = v; changed(); }),
      textInput(r.description, (v) => { r.description = v; changed(); }, "description"),
      el("button", { type: "button", onclick: () => { rows.splice(i, 1); draw(); changed(); } }, "Remove"))));
    box.append(el("button", { type: "button", onclick: () => { rows.push({ key: "", type: "text", description: "" }); draw(); } }, "Add"));
  };
  draw();
  return box;
}

function renderForm() {
  const m = state.model, f = clear(byId("form"));
  f.append(
    field("id", textInput(m.id, (v) => { m.id = v; changed(); })),
    field("description", textInput(m.description, (v) => { m.description = v; changed(); })),
    field("model", textInput(m.model, (v) => { m.model = v; changed(); }, "session model")),
    field("effort", textInput(m.effort, (v) => { m.effort = v; changed(); }, "session effort")),
    field("start_column", selectInput(["", ...state.columns], m.start_column, (v) => { m.start_column = v; changed(); })),
    field("inputs", inputRows(m.inputs)));
}

function renderPipeline() {
  const box = clear(byId("pipeline"));
  if (!state.model.steps.length) box.append(el("div", { class: "muted" }, "Drag steps here."));
  state.model.steps.forEach((s, i) => box.append(pipelineRow(s, i)));
}
function pipelineRow(s, i) {
  const info = state.steps.find((x) => x.id === s.id);
  const mark = info && info.hidden ? el("span", { class: "tag" }, "hidden") : "";
  const head = el("div", { class: "head", draggable: "true" },
    el("span", { class: "muted" }, String(i + 1)),
    el("span", { class: "link grow", onclick: guard(() => showDetail(s.id, i + 1)) }, s.id),
    mark,
    el("button", { type: "button", onclick: () => { s.open = !s.open; renderPipeline(); } }, s.open ? "Close" : "Edit"),
    el("button", { type: "button", onclick: () => { state.model.steps.splice(i, 1); renderPipeline(); changed(); } }, "Remove"));
  head.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", "move:" + i); e.dataTransfer.effectAllowed = "move"; });
  const card = el("div", { class: "card", "data-row": "1" }, head);
  if (s.open) {
    card.append(
      el("div", { class: "muted" }, "with"),
      pairRows(s.with, "key", "value", "key", "value"),
      field("model", textInput(s.model, (v) => { s.model = v; changed(); })),
      field("effort", textInput(s.effort, (v) => { s.effort = v; changed(); })),
      field("column", selectInput(["", ...state.columns], s.column, (v) => { s.column = v; changed(); })));
  }
  return card;
}
function dropIndex(y) {
  const rows = [...byId("pipeline").querySelectorAll("[data-row]")];
  const at = rows.findIndex((r) => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
  return at < 0 ? rows.length : at;
}
function setupDrop() {
  const zone = byId("pipeline");
  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault();
    zone.classList.remove("over");
    const [kind, value] = e.dataTransfer.getData("text/plain").split(":");
    const steps = state.model.steps;
    let at = dropIndex(e.clientY);
    if (kind === "new") steps.splice(at, 0, entryOf(value));
    else if (kind === "move") {
      const from = Number(value);
      const [item] = steps.splice(from, 1);
      if (from < at) at -= 1;
      steps.splice(at, 0, item);
    } else return;
    renderPipeline();
    changed();
  });
}

function renderFilters() {
  const f = clear(byId("filters"));
  const categories = ["", ...new Set(state.steps.map((s) => s.category).filter(Boolean))].sort();
  const current = state.categoryFilter || "";
  f.append(selectInput(categories, categories.includes(current) ? current : "", (v) => { state.categoryFilter = v; renderAvailable(); }),
    textInput(state.textFilter || "", (v) => { state.textFilter = v; renderAvailable(); }, "Filter"),
    el("button", { type: "button", onclick: guard(async () => { await loadSteps(); if (state.model) await runCheck(); }) }, "Reload steps"));
  const toggle = el("input", { type: "checkbox" });
  toggle.checked = state.showHidden;
  toggle.addEventListener("change", () => { state.showHidden = toggle.checked; saveShowHidden(toggle.checked); renderAvailable(); });
  f.append(el("label", {}, toggle, " Show hidden steps"));
}
function renderAvailable() {
  const box = clear(byId("available"));
  const text = (state.textFilter || "").toLowerCase();
  const category = state.categoryFilter || "";
  for (const s of state.steps) {
    if (s.hidden && !state.showHidden) continue;
    if (category && s.category !== category) continue;
    if (text && !(s.id + " " + s.category + " " + s.description).toLowerCase().includes(text)) continue;
    const card = el("div", { class: "card clickable" + (s.hidden ? " dim" : ""), draggable: "true", onclick: () => showDetail(s.id) },
      el("strong", {}, s.id), " ",
      el("span", { class: "tag" }, s.category || "no category"),
      el("span", { class: "tag" }, s.level),
      el("span", { class: "tag" }, s.run_in),
      el("button", { type: "button", onclick: (e) => { e.stopPropagation(); guard(() => setHidden(s.id, !s.hidden))(); } }, s.hidden ? "Unhide" : "Hide"),
      el("div", { class: "muted" }, s.description));
    card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", "new:" + s.id); e.dataTransfer.effectAllowed = "copy"; });
    box.append(card);
  }
}
async function setHidden(id, hide) {
  await api("/api/steps/" + encodeURIComponent(id) + (hide ? "/hide" : "/unhide"), {});
  await loadSteps();
  if (state.model) await runCheck();
}
async function loadSteps() {
  state.steps = await api("/api/steps");
  renderFilters();
  renderAvailable();
  if (state.model) renderPipeline();
}

function valueText(v) { return typeof v === "string" ? v : JSON.stringify(v); }
function outputsText(outputs) {
  return Object.entries(outputs).map(([k, o]) => `${k} (${o.type}${o.optional ? ", optional" : ""})`).join(", ");
}
function keyRow(r, onPick) {
  const name = el("span", onPick ? { class: "link" } : {}, r.name);
  if (onPick) name.addEventListener("click", () => onPick(r));
  return el("div", {}, name, " ", el("span", { class: "muted" }, `${r.type}, ${r.source}, ${r.set} set`));
}
async function keysAt(position) {
  return api("/api/pipelines/keys", { data: dataOf(state.model), at: position });
}
async function keysBlock(position) {
  const rows = await keysAt(position);
  const box = el("div", {}, el("div", { class: "muted" }, "Keys available here"));
  for (const r of rows) box.append(keyRow(r, null));
  return box;
}
async function showDetail(id, position = null) {
  const d = await api("/api/steps/" + encodeURIComponent(id));
  const box = clear(byId("detail"));
  box.classList.remove("muted");
  box.append(el("h4", {}, d.id), el("div", {}, d.description));
  const list = el("dl");
  const rows = Object.entries(d.manifest).filter(([k]) => !["id", "description", "outputs", "steps"].includes(k));
  for (const [k, v] of rows) list.append(el("dt", {}, k), el("dd", {}, valueText(v)));
  list.append(el("dt", {}, "uses"), el("dd", {}, d.uses.join(", ") || "none"));
  list.append(el("dt", {}, "outputs"), el("dd", {}, outputsText(d.outputs) || "none"));
  list.append(el("dt", {}, "level"), el("dd", {}, d.level), el("dt", {}, "file"), el("dd", {}, d.path));
  box.append(list);
  if (d.children.length) {
    const kids = el("div", {}, el("div", { class: "muted" }, "Child steps"));
    for (const c of d.children) kids.append(el("div", {}, el("span", { class: "link", onclick: guard(() => showDetail(c)) }, c)));
    box.append(kids);
  }
  box.append(el("div", { class: "muted" }, "Body"), el("pre", {}, d.body));
  const actions = el("div", { class: "row" });
  if (d.level !== "builtin") actions.append(el("button", { type: "button", onclick: () => openStepForm({ mode: "edit", detail: d, position }) }, "Edit"));
  if (d.level !== "local") actions.append(el("button", { type: "button", onclick: () => openStepForm({ mode: "copy-local", detail: d, position }) }, "Copy to local"));
  actions.append(el("button", { type: "button", onclick: () => openStepForm({ mode: "new", detail: d, duplicate: true, position }) }, "Duplicate"));
  if (d.level !== "builtin") {
    actions.append(el("button", { type: "button", onclick: guard(async () => {
      const plan = await api("/api/steps/" + encodeURIComponent(d.id) + "/delete/dry-run", { level: d.level });
      box.append(deletePlanBlock(d, plan));
    }) }, "Delete"));
  }
  box.append(actions);
  if (position && state.model) box.append(await keysBlock(position));
}
const MODELS = ["", "opus", "sonnet", "haiku"];
const EFFORTS = ["", "low", "medium", "high", "max"];
const FORM_CHECK_DELAY_MS = 300;

function formModelOf(detail, duplicate) {
  const m = detail ? detail.manifest : {};
  return {
    original: m,
    id: duplicate ? "" : (m.id || ""), description: m.description || "", category: m.category || "", newCategory: "",
    type: m.type || "ai", run_in: m.run_in || "", model: m.model || "", effort: m.effort || "", column: m.column || "",
    required: !!m.required, wait_external: !!m.wait_external, done_when: m.done_when || "", done_check: m.done_check || "",
    requires: [...(m.requires || [])],
    config: Object.entries(m.config || {}).map(([key, v]) => ({ key, description: (v && v.description) || "",
      default: v && "default" in v ? String(v.default) : "", hasDefault: !!(v && "default" in v), edited: false })),
    outputs: Object.entries(m.outputs || {}).map(([key, v]) => ({ key, type: (v && v.type) || "text",
      description: (v && v.description) || "", optional: !!(v && v.optional) })),
    steps: [...(m.steps || [])], body: detail && m.type !== "group" ? detail.body : "",
  };
}
const FORM_KEYS = ["id", "description", "category", "type", "done_when", "done_check", "required", "wait_external", "column",
  "requires", "config", "run_in", "model", "effort", "steps", "outputs"];
function manifestOf(f) {
  const m = { ...f.original };
  for (const k of FORM_KEYS) delete m[k];
  Object.assign(m, { id: f.id, description: f.description, category: f.newCategory || f.category, type: f.type,
    done_when: f.done_when, done_check: f.done_check, required: f.required, wait_external: f.wait_external,
    column: f.column, requires: f.requires.filter(Boolean), config: {} });
  if (f.type === "ai") Object.assign(m, { run_in: f.run_in, model: f.model, effort: f.effort });
  if (f.type === "group") m.steps = f.steps;
  else {
    m.outputs = {};
    for (const o of f.outputs) if (o.key) m.outputs[o.key] = { type: o.type, description: o.description, ...(o.optional ? { optional: true } : {}) };
  }
  const originalConfig = (f.original && f.original.config) || {};
  for (const c of f.config) {
    if (!c.key) continue;
    const spec = { ...(originalConfig[c.key] || {}), description: c.description };
    const kept = !c.edited && c.hasDefault && spec.default !== undefined && typeof spec.default !== "string";
    if (!kept) {
      if (c.hasDefault || c.default !== "") spec.default = c.default;
      else delete spec.default;
    }
    m.config[c.key] = spec;
  }
  return m;
}
function formBody() { const f = state.form.f; return f.type === "group" ? "" : f.body; }

function openStepForm(opts) {
  const mode = opts.mode;
  state.form = { mode, level: mode === "edit" ? opts.detail.level : "local", position: opts.position || null,
    f: formModelOf(opts.detail, !!opts.duplicate), keys: [], check: null, preview: null, impact: null,
    commit: null, saved: null, textarea: null, timer: null, ticket: 0 };
  byId("stepform").hidden = false;
  renderStepForm();
  guard(refreshFormKeys)();
  formChanged();
}
function closeStepForm() { byId("stepform").hidden = true; state.form = null; }
async function refreshFormKeys() {
  const s = state.form;
  s.keys = s.position && state.model ? await keysAt(s.position) : state.formData.factory_keys;
  renderFormSide();
}
function formChanged() {
  const s = state.form;
  s.preview = null; s.impact = null; s.saved = null; s.commit = null;
  clearTimeout(s.timer);
  s.timer = setTimeout(guard(runFormCheck), FORM_CHECK_DELAY_MS);
  renderFormSide();
}
async function runFormCheck() {
  const s = state.form;
  if (!s) return;
  const ticket = ++s.ticket;
  const result = await api("/api/steps/check", { manifest: manifestOf(s.f), body: formBody(), level: s.mode === "copy-local" ? "local" : s.level });
  if (state.form !== s || ticket !== s.ticket) return;
  s.check = result;
  renderFormSide();
}

function checkbox(value, onChange) {
  const c = el("input", { type: "checkbox" });
  c.checked = value;
  c.addEventListener("change", () => onChange(c.checked));
  return c;
}
function rowsEditor(rows, makeRow, blank) {
  const box = el("div");
  const draw = () => {
    clear(box);
    rows.forEach((r, i) => box.append(el("div", { class: "row" }, ...makeRow(r, i),
      el("button", { type: "button", onclick: () => { rows.splice(i, 1); draw(); formChanged(); } }, "Remove"))));
    box.append(el("button", { type: "button", onclick: () => { rows.push(blank()); draw(); formChanged(); } }, "Add"));
  };
  draw();
  return box;
}
function requiresRows(list) {
  const rows = list.map((value) => ({ value }));
  const sync = () => { list.splice(0, list.length, ...rows.map((r) => r.value)); formChanged(); };
  return rowsEditor(rows, (r) => [textInput(r.value, (v) => { r.value = v; sync(); }, "skill or tool, for example gh")], () => ({ value: "" }));
}
function configRows(rows) {
  return rowsEditor(rows, (r) => [
    textInput(r.key, (v) => { r.key = v; formChanged(); }, "key"),
    textInput(r.description, (v) => { r.description = v; formChanged(); }, "description"),
    textInput(r.default, (v) => { r.default = v; r.edited = true; formChanged(); }, "default")], () => ({ key: "", description: "", default: "", hasDefault: false }));
}
function outputRows(rows) {
  return rowsEditor(rows, (r) => [
    textInput(r.key, (v) => { r.key = v; formChanged(); }, "key"),
    selectInput(KEY_TYPES, r.type, (v) => { r.type = v; formChanged(); }),
    textInput(r.description, (v) => { r.description = v; formChanged(); }, "description"),
    el("label", {}, checkbox(r.optional, (v) => { r.optional = v; formChanged(); }), " optional")],
    () => ({ key: "", type: "text", description: "", optional: false }));
}
function childList(children) {
  const box = el("div");
  const draw = () => {
    clear(box);
    children.forEach((c, i) => {
      const card = el("div", { class: "card head", draggable: "true" }, el("span", { class: "grow" }, c),
        el("button", { type: "button", onclick: () => { children.splice(i, 1); draw(); formChanged(); } }, "Remove"));
      card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", "child:" + i); });
      card.addEventListener("dragover", (e) => e.preventDefault());
      card.addEventListener("drop", (e) => {
        e.preventDefault();
        const [kind, value] = e.dataTransfer.getData("text/plain").split(":");
        if (kind !== "child") return;
        const [item] = children.splice(Number(value), 1);
        children.splice(i, 0, item);
        draw(); formChanged();
      });
      box.append(card);
    });
    const pick = selectInput(["", ...state.steps.filter((s) => !s.hidden).map((s) => s.id)], "", () => {});
    box.append(el("div", { class: "row" }, pick, el("button", { type: "button", onclick: () => {
      if (pick.value) { children.push(pick.value); draw(); formChanged(); }
    } }, "Add child step")));
  };
  draw();
  return box;
}
function categoryInput(f) {
  const options = ["", ...state.formData.categories];
  if (f.category && !options.includes(f.category)) options.push(f.category);
  return el("div", { class: "row" }, selectInput(options, f.category, (v) => { f.category = v; formChanged(); }),
    textInput(f.newCategory, (v) => { f.newCategory = v.trim(); formChanged(); }, "new category"));
}
function levelInput() {
  const s = state.form;
  const box = el("div", { class: "row" });
  for (const value of ["local", "generic"]) {
    if (value === "generic" && !state.formData.library) continue;
    const r = el("input", { type: "radio", name: "steplevel", value });
    r.checked = s.level === value;
    r.addEventListener("change", () => { s.level = value; formChanged(); });
    box.append(el("label", {}, r, " " + value + " "));
  }
  return box;
}
function bodyArea(f) {
  const t = el("textarea");
  t.value = f.body;
  t.addEventListener("input", () => { f.body = t.value; formChanged(); });
  state.form.textarea = t;
  return t;
}
function insertAtCursor(text) {
  const t = state.form.textarea;
  if (!t) return;
  const start = t.selectionStart, end = t.selectionEnd;
  t.value = t.value.slice(0, start) + text + t.value.slice(end);
  t.selectionStart = t.selectionEnd = start + text.length;
  t.focus();
  state.form.f.body = t.value;
  formChanged();
}
function insertKey(name, isConfig) {
  const f = state.form.f;
  if (f.type === "ai") insertAtCursor(isConfig ? `{{config.${name}}}` : `{{${name}}}`);
  else if (f.type === "command") insertAtCursor(isConfig ? `$FACTORY_CONFIG_${name.toUpperCase()}` : `$FACTORY_KEY_${name.toUpperCase()}`);
}

function renderStepForm() {
  const s = state.form, f = s.f, box = clear(byId("stepform"));
  const titles = { new: "New step", edit: "Edit step " + f.id, "copy-local": "Copy " + f.id + " to local" };
  const idInput = textInput(f.id, (v) => { f.id = v; formChanged(); }, "step id");
  if (s.mode !== "new") idInput.disabled = true;
  const left = el("div");
  left.append(el("div", { class: "head" }, el("h3", { class: "grow" }, titles[s.mode]),
      el("button", { type: "button", onclick: closeStepForm }, "Close")),
    field("id", idInput),
    field("description", textInput(f.description, (v) => { f.description = v; formChanged(); })),
    field("category", categoryInput(f)),
    field("type", selectInput(["ai", "command", "group"], f.type, (v) => { f.type = v; renderStepForm(); formChanged(); })));
  if (s.mode === "new") left.append(field("level", levelInput()));
  if (f.type === "ai") {
    left.append(field("run_in", selectInput(["", "session", "subagent"], f.run_in, (v) => { f.run_in = v; formChanged(); })),
      field("model", selectInput(MODELS, f.model, (v) => { f.model = v; formChanged(); })),
      field("effort", selectInput(EFFORTS, f.effort, (v) => { f.effort = v; formChanged(); })));
  }
  left.append(field("column", selectInput(["", ...state.columns], f.column, (v) => { f.column = v; formChanged(); })),
    field("required", checkbox(f.required, (v) => { f.required = v; formChanged(); })),
    field("wait_external", checkbox(f.wait_external, (v) => { f.wait_external = v; formChanged(); })),
    field("done_when", textInput(f.done_when, (v) => { f.done_when = v; formChanged(); })),
    field("done_check", textInput(f.done_check, (v) => { f.done_check = v; formChanged(); }, "optional shell command")),
    field("requires", requiresRows(f.requires)),
    field("config", configRows(f.config)));
  if (f.type !== "group") left.append(field("outputs", outputRows(f.outputs)));
  state.form.textarea = null;
  left.append(f.type === "group" ? field("child steps", childList(f.steps)) : field(f.type === "ai" ? "prompt" : "command", bodyArea(f)));
  box.append(el("div", { class: "formgrid" }, left, el("div", { id: "formside", class: "formside" })));
  renderFormSide();
}

function renderFormSide() {
  const s = state.form, side = byId("formside");
  if (!s || !side) return;
  clear(side);
  const f = s.f;
  if (f.type !== "group") {
    const keyBox = el("div", {}, el("div", { class: "muted" }, s.position && state.model ? "Keys available at this position" : "Factory keys"));
    for (const r of s.keys) keyBox.append(keyRow(r, (k) => insertKey(k.name, false)));
    for (const c of f.config) if (c.key) keyBox.append(keyRow({ name: "config." + c.key, type: "config", source: "this step", set: "always" }, () => insertKey(c.key, true)));
    side.append(keyBox);
  }
  const check = s.check;
  if (check) {
    for (const e of check.errors) side.append(el("div", { class: "problem error" }, "Error: " + e));
    for (const w of check.warnings) side.append(el("div", { class: "problem warning" }, "Warning: " + w));
    if (!check.errors.length) side.append(el("div", { class: "muted" }, "Uses: " + (check.uses.join(", ") || "none") + ". Outputs: " + (outputsText(check.outputs) || "none") + "."));
  }
  if (f.type === "ai") {
    side.append(el("button", { type: "button", onclick: guard(async () => {
      s.preview = (await api("/api/steps/preview", { manifest: manifestOf(f), body: formBody() })).text;
      renderFormSide();
    }) }, "Preview"));
    if (s.preview !== null) side.append(el("pre", {}, s.preview));
  }
  const save = el("button", { type: "button", class: "primary", onclick: guard(startSave) }, "Save");
  save.disabled = !check || check.errors.length > 0;
  side.append(el("div", { class: "row" }, save));
  if (s.impact) side.append(impactBlock(s.impact));
  if (s.saved) side.append(el("div", { class: "muted" }, "Saved to " + s.saved.path));
  if (s.saved) for (const w of s.saved.warnings) side.append(el("div", { class: "problem warning" }, "Warning: " + w));
  if (s.commit) side.append(commitBox(s.commit, () => { s.commit = null; side.append(el("div", { class: "muted" }, "Committed to the library.")); }));
}
function impactBlock(imp) {
  const b = el("div", { class: "card" }, el("div", {}, "This change applies to:"));
  for (const p of imp.pipelines) b.append(el("div", {}, `pipeline ${p.id} (${p.level})`));
  for (const g of imp.groups) b.append(el("div", {}, `group step ${g.id} (${g.level})`));
  for (const t of imp.tasks) b.append(el("div", {}, `task ${t.id}: the change applies from its next step`));
  if (!imp.pipelines.length && !imp.groups.length && !imp.tasks.length) b.append(el("div", { class: "muted" }, "No pipeline or task uses this step."));
  for (const w of imp.warnings) b.append(el("div", { class: "problem warning" }, w));
  b.append(el("div", { class: "row" },
    el("button", { type: "button", class: "primary", onclick: guard(doSave) }, "Confirm save"),
    el("button", { type: "button", onclick: () => { state.form.impact = null; renderFormSide(); } }, "Cancel")));
  return b;
}
async function startSave() {
  const s = state.form;
  if (s.mode === "edit") {
    s.impact = await api("/api/steps/impact", { id: s.f.id });
    renderFormSide();
    return;
  }
  await doSave();
}
async function doSave() {
  const s = state.form;
  let result;
  try {
    result = await api("/api/steps/save", { manifest: manifestOf(s.f), body: formBody(), level: s.level, mode: s.mode });
  } catch (e) {
    if (e.conflict) showError(e.message);
    return;
  }
  s.impact = null;
  s.saved = result;
  s.commit = result.library_commit;
  s.mode = "edit";
  s.level = result.level;
  await loadSteps();
  if (state.model) await runCheck();
  renderStepForm();
}
function userText(u) {
  if (u.kind === "task") return "task " + u.id;
  return (u.kind === "pipeline" ? "pipeline " : "group step ") + u.id + " (" + u.level + ")";
}
function deletePlanBlock(d, plan) {
  const block = el("div", { class: "card" }, el("div", {}, "Delete the " + plan.level + " step " + plan.id + ". Files:"));
  for (const f of plan.files) block.append(el("div", { class: "muted" }, f));
  if (plan.replaced_by) block.append(el("div", {}, "After the delete, the " + plan.replaced_by + " step " + plan.id + " is used."));
  if (plan.in_use_stays) block.append(el("div", {}, "The " + plan.in_use_stays + " step " + plan.id + " stays in use."));
  for (const w of plan.warnings) block.append(el("div", { class: "problem warning" }, "Warning: " + w));
  if (plan.blocked) {
    block.append(el("div", { class: "problem error" }, "The step is still used. Remove it from these first:"));
    for (const u of plan.users) block.append(el("div", { class: "problem error" }, userText(u)));
    return block;
  }
  block.append(el("div", { class: "row" },
    el("button", { type: "button", class: "primary", onclick: guard(() => deleteStep(d)) }, "Confirm delete"),
    el("button", { type: "button", onclick: () => block.remove() }, "Cancel")));
  return block;
}
async function deleteStep(d) {
  const result = await api("/api/steps/" + encodeURIComponent(d.id) + "/delete", { level: d.level });
  const box = clear(byId("detail"));
  box.append(el("div", {}, "Deleted the " + result.level + " step " + result.id + "."));
  for (const f of result.removed) box.append(el("div", { class: "muted" }, f));
  if (result.library_commit) {
    box.append(commitBox(result.library_commit, () => box.append(el("div", { class: "muted" }, "Committed to the library."))));
  }
  await loadSteps();
  if (state.model) await runCheck();
}

function changed(keepSaveResult = false) {
  if (!keepSaveResult) { state.commit = null; state.savedPath = null; }
  state.hasError = true;
  renderSave();
  clearTimeout(state.checkTimer);
  state.checkTimer = setTimeout(guard(runCheck), CHECK_DELAY_MS);
}
async function runCheck() {
  const ticket = ++state.checkCount;
  const problems = await api("/api/pipelines/check", { data: dataOf(state.model), level: state.saveLevel });
  if (ticket !== state.checkCount) return;
  const box = clear(byId("problems"));
  for (const p of problems) box.append(el("div", { class: "problem " + p.level }, p.level === "error" ? "Error: " : "Warning: ", p.message));
  if (!problems.length) box.append(el("div", { class: "muted" }, "No problems."));
  state.hasError = problems.some((p) => p.level === "error");
  renderSave();
}

function radio(value, label) {
  const input = el("input", { type: "radio", name: "level", value });
  input.checked = state.saveLevel === value;
  input.addEventListener("change", () => { state.saveLevel = value; changed(true); });
  return el("label", {}, input, " " + label + " ");
}
function renderSave() {
  const box = clear(byId("save"));
  const localLabel = state.loadedLevel === "generic" ? "Save a local override" : "Save local";
  box.append(el("div", { class: "row" }, radio("generic", "Save generic"), radio("local", localLabel)));
  const save = el("button", { type: "button", class: "primary", onclick: guard(() => savePipeline(false)) }, "Save");
  save.disabled = state.hasError;
  box.append(save);
  if (state.confirmReplace) {
    box.append(el("div", { class: "problem warning" }, "A pipeline with this id already exists at this level. Replace it?"),
      el("div", { class: "row" },
        el("button", { type: "button", class: "primary", onclick: guard(() => savePipeline(true)) }, "Replace"),
        el("button", { type: "button", onclick: () => { state.confirmReplace = false; renderSave(); } }, "Cancel")));
  }
  if (state.savedPath) box.append(el("div", { class: "muted" }, "Saved to " + state.savedPath));
  if (state.commit) {
    box.append(commitBox(state.commit, () => {
      state.commit = null;
      state.savedPath = state.savedPath + " (committed to the library)";
      renderSave();
    }));
  }
}
function commitBox(offer, done) {
  const box = el("div", {}, el("div", {}, "The library is a git repository. Files:"));
  for (const p of offer.paths) box.append(el("div", { class: "muted" }, p));
  box.append(el("div", {}, offer.message),
    el("button", { type: "button", onclick: guard(async () => {
      await api("/api/library/commit", { message: offer.message, paths: offer.paths });
      done();
    }) }, "Commit to library"));
  return box;
}
async function savePipeline(replace) {
  const body = { data: dataOf(state.model), level: state.saveLevel, replace };
  if (state.original) { body.original_id = state.original.id; body.original_level = state.original.level; }
  let result;
  try {
    result = await api("/api/pipelines/save", body);
  } catch (e) {
    if (!e.conflict) throw e;
    state.confirmReplace = true;
    renderSave();
    return;
  }
  state.confirmReplace = false;
  state.original = { id: body.data.id, level: result.level };
  state.savedPath = result.path;
  state.commit = result.library_commit;
  state.loadedLevel = result.level;
  renderSave();
}
function openModel(model, level, original = null) {
  state.model = model;
  state.original = original;
  state.confirmReplace = false;
  state.loadedLevel = level;
  state.saveLevel = level === "generic" ? "generic" : "local";
  byId("start").hidden = true;
  byId("editor").hidden = false;
  byId("title").textContent = model.id || "new pipeline";
  renderForm();
  renderPipeline();
  changed();
}
async function loadPipeline(id) {
  const loaded = await api("/api/pipelines/" + encodeURIComponent(id));
  openModel(modelOf(loaded.data), loaded.level, { id: loaded.data.id, level: loaded.level });
}
function pipelineSelect() {
  const s = el("select");
  for (const p of state.pipelines) s.append(el("option", { value: p.id }, p.id + " (" + p.level + ")"));
  return s;
}
function renderStart() {
  const box = clear(byId("start"));
  box.hidden = false;
  box.append(el("h3", {}, "Start"));
  box.append(el("div", { class: "row" }, el("button", { type: "button", onclick: () => openStepForm({ mode: "new" }) }, "New step")));
  box.append(el("div", { class: "row" }, el("button", { type: "button", onclick: () => openModel(emptyModel(), null) }, "Create an empty pipeline")));
  const copySelect = pipelineSelect();
  const newId = el("input", { type: "text", placeholder: "new pipeline id" });
  box.append(el("div", { class: "row" },
    el("button", { type: "button", onclick: guard(async () => {
      const copied = await api("/api/pipelines/copy", { source: copySelect.value, new_id: newId.value });
      openModel(modelOf(copied.data), null);
    }) }, "Copy an existing pipeline"), copySelect, newId));
  const editSelect = pipelineSelect();
  box.append(el("div", { class: "row" },
    el("button", { type: "button", onclick: guard(() => loadPipeline(editSelect.value)) }, "Edit an existing pipeline"), editSelect));
}

async function init() {
  const info = await api("/api/info");
  state.columns = info.columns;
  setupDrop();
  await loadSteps();
  state.formData = await api("/api/step-form");
  byId("newstep").addEventListener("click", () => openStepForm({ mode: "new" }));
  const stepParam = params.get("step");
  if (params.get("new_step")) openStepForm({ mode: "new" });
  else if (stepParam) {
    try {
      const d = await api("/api/steps/" + encodeURIComponent(stepParam));
      openStepForm({ mode: d.level === "builtin" ? "copy-local" : "edit", detail: d });
    } catch (e) {}
  }
  const id = params.get("id");
  let failure = null;
  if (id) {
    try { await loadPipeline(id); return; } catch (e) { failure = e.message; }
  }
  state.pipelines = await api("/api/pipelines");
  renderStart();
  if (failure) showError(failure);
}
init().catch(() => {});
</script>
</body>
</html>
