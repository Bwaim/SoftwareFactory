<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root { color-scheme: dark;
  --bg: #1A1110; --top: #000000; --fg: #FFFFFF; --muted: #B3A8A4; --muted-strong: #CFC7C3; --soft: #E6DFDC;
  --column: #241A19; --panel: #2E2322; --panel-line: #3D302F; --line: #4A3B39; --raised: #3A2E2D; --done: #261C1B;
  --accent: #C4005E; --accent-hover: #A8004F; --link: #FF7AB6; --link-hover: #FFA8CF; --brand-pink: #FF5AA5;
  --yellow: #FECD40; --err: #FF8AC0; --err-line: #6E2A4A; --err-bg: #3A1A29; --ok: #B5E07F;
  --active-bg: #283A16; --active-fg: #B5E07F; --active-dot: #7CC63A;
  --approval-bg: #423410; --approval-fg: #FECD40; --approval-dot: #FECD40;
  --attn-bg: #4A1430; --attn-fg: #FF9CC8; --attn-dot: #FF5AA5; --attn-line: #5C2441;
  --wait-bg: #352448; --wait-fg: #D6BCEB; --wait-dot: #B98BDB;
  --neutral-fg: #D8D0CC; --paused-dot: #A99E9A;
  --shadow: rgba(0, 0, 0, 0.5); --bot-band: #FFFFFF; --bot-eye: #1A1110;
  --font: "Nextory Sans", Figtree, Roboto, Arial, sans-serif; }
:root[data-theme="light"] { color-scheme: light;
  --bg: #F9F5F2; --top: #FFFFFF; --fg: #1A1110; --muted: #6B5F5B; --muted-strong: #5A4E4A; --soft: #3D302F;
  --column: #F1ECE8; --panel: #FFFFFF; --panel-line: #E4DDD8; --line: #D6CDC8; --raised: #EEE7E3; --done: #F7F3F0;
  --link: #B0005A; --link-hover: #8A0047; --brand-pink: #C4005E;
  --err: #B0004F; --err-line: #F0B3CE; --err-bg: #FDEBF3; --ok: #3E7A12;
  --active-bg: #E6F4D7; --active-fg: #2F6110; --active-dot: #5DA21E;
  --approval-bg: #FFF3CC; --approval-fg: #6E5100; --approval-dot: #E0A800;
  --attn-bg: #FDE3EF; --attn-fg: #A3004E; --attn-dot: #E0337F; --attn-line: #F5C2D9;
  --wait-bg: #EFE6F7; --wait-fg: #5B2D80; --wait-dot: #8A55B5;
  --neutral-fg: #4A3F3B; --paused-dot: #8C817D;
  --shadow: rgba(26, 17, 16, 0.15); --bot-band: #1A1110; --bot-eye: #FFFFFF; }
body { margin: 0; font: 14px/1.45 var(--font); background: var(--bg); color: var(--fg); min-height: 100vh; }
[hidden] { display: none !important; }
header { background: var(--top); border-bottom: 1px solid var(--panel-line); padding: 12px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header .grow { flex: 1; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 48px; height: 48px; flex: none; }
.brand .names { display: flex; flex-direction: column; }
.brand .wordmark { font-size: 22px; font-weight: 800; letter-spacing: .05em; line-height: 1.1; }
.brand .wordmark em { font-style: normal; color: var(--brand-pink); }
.brand .tagline { font-size: 11px; color: var(--muted-strong); letter-spacing: .02em; }
.page-name { font-size: 16px; font-weight: 700; padding-left: 16px; border-left: 1px solid var(--line); }
#title { font-size: 13px; color: var(--muted-strong); }
.theme-toggle { width: 36px; padding: 0; border-radius: 50%; background: transparent; }
.theme-toggle svg { width: 18px; height: 18px; }
:root:not([data-theme="light"]) .theme-toggle .moon, :root[data-theme="light"] .theme-toggle .sun { display: none; }
main { display: grid; grid-template-columns: 320px minmax(0, 1fr) 360px; gap: 16px; padding: 20px 24px 32px; align-items: start; }
main > section { background: var(--column); border-radius: 16px; padding: 16px; }
section { min-width: 0; }
h3 { margin: 0 0 12px; font-size: 17px; font-weight: 800; }
input, select, button, textarea { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, .link:focus-visible { outline: 2px solid var(--brand-pink); outline-offset: 2px; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); padding: 0; }
button { cursor: pointer; font-size: 13px; font-weight: 600; min-height: 32px; padding: 0 14px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:hover:not(:disabled) { background: var(--raised); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--accent); color: #FFFFFF; border-color: var(--accent); min-height: 36px; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.danger { color: var(--err); border-color: var(--err-line); }
.card { border: 1px solid var(--panel-line); border-radius: 12px; padding: 12px; margin: 8px 0; background: var(--panel); cursor: grab; word-break: break-word; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--line); }
.card > strong { font-size: 14px; }
.card > button { min-height: 26px; font-size: 12px; padding: 0 10px; margin-left: 4px; }
.card .muted { margin-top: 4px; }
.muted { color: var(--muted); font-size: 12px; }
#error { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--accent); color: #FFFFFF; font-weight: 600; padding: 10px 24px; }
.problem { font-size: 13px; margin: 4px 0; }
.problem.error { color: var(--err); }
.problem.warning { color: var(--approval-fg); }
#pipeline { min-height: 200px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px; margin: 12px 0; }
#pipeline > .muted:only-child { text-align: center; padding: 72px 0; font-size: 13px; }
#pipeline.over { border-color: var(--brand-pink); background: var(--attn-bg); }
pre { white-space: pre-wrap; border: 1px solid var(--panel-line); border-radius: 8px; padding: 10px; background: var(--panel); font-size: 12px; }
.field { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; margin: 8px 0; align-items: center; }
.field > label { font-weight: 600; color: var(--soft); font-size: 13px; }
.row { display: flex; gap: 6px; margin: 6px 0; align-items: center; flex-wrap: wrap; }
.row input { flex: 1; min-width: 0; }
.field > input[type=checkbox] { justify-self: start; margin: 0; }
.head { display: flex; gap: 8px; align-items: center; cursor: grab; }
.head .grow { flex: 1; }
.head > .muted:first-child { min-width: 22px; height: 22px; border-radius: 11px; background: var(--raised); color: var(--soft); display: inline-grid; place-items: center; font-weight: 700; }
.head > button { min-height: 28px; font-size: 12px; padding: 0 10px; }
.link { color: var(--link); cursor: pointer; font-weight: 600; text-decoration: none; }
.link:hover { color: var(--link-hover); text-decoration: underline; }
.loop { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--wait-bg); }
.loop > .muted:first-child { color: var(--wait-fg); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.start { max-width: 720px; margin: 32px auto; padding: 24px; background: var(--column); border-radius: 16px; }
.start h3 { font-size: 22px; }
.start .row { margin: 12px 0; }
.start .row > button:first-child { min-width: 220px; }
dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 8px; margin: 8px 0; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; }
.dim { opacity: 0.5; }
.tag { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; color: var(--soft); background: var(--raised); margin-right: 4px; }
#stepform { position: fixed; inset: 0; background: var(--bg); overflow: auto; padding: 20px 24px; z-index: 10; }
.formgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.formgrid > div { background: var(--column); border-radius: 16px; padding: 16px; }
#stepform textarea { width: 100%; min-height: 280px; box-sizing: border-box; font-family: ui-monospace, monospace; }
.formside { position: sticky; top: 0; }
@media (max-width: 1100px) {
  main, .formgrid { grid-template-columns: minmax(0, 1fr); }
  .formside { position: static; }
}
@media (max-width: 600px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .page-name { padding-left: 0; border-left: 0; }
  .field { grid-template-columns: 1fr; }
}
</style>

    <path d="M30 48 L22 28 Q60 10 98 28 L90 48 Z" fill="#C4005E"/>
    <rect x="20" y="44" width="80" height="11" rx="5.5" fill="var(--bot-band)"/>
    <circle cx="60" cy="32" r="7" fill="#FECD40"/>
    <circle cx="46" cy="76" r="8" fill="var(--bot-eye)"/><circle cx="47.5" cy="77" r="3.5" fill="var(--bot-band)"/>
    <line x1="66" y1="64" x2="94" y2="58" stroke="var(--bot-band)" stroke-width="3" stroke-linecap="round"/>

<header>
  <div class="brand">
    <svg viewBox="0 0 120 120" role="img" aria-label="Captain Bot"><use href="#captain-bot"/></svg>
    <div class="names">
      <span class="wordmark">CAPT<em>N</em></span>

  <span class="grow"></span>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

<section id="start" class="start" hidden></section>
<main id="editor" hidden>
  <section>
    <h3>Available steps</h3>
    <div class="row"><button type="button" id="newstep">New step</button></div>
    <div id="filters" class="row"></div>
    <div id="available"></div>
  </section>
  <section>
    <h3>Pipeline</h3>
    <div id="form"></div>
    <div id="pipeline"></div>
    <div id="problems"></div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get("token");
const WS = params.get("ws");
const GLOBAL_API = /^\/api\/(ping|shutdown|jobs\/|workspaces|host)/;
function apiPath(path) { return GLOBAL_API.test(path) ? path : `/api/w/${encodeURIComponent(WS)}${path.slice(4)}`; }
const CHECK_DELAY_MS = 300;
const SHOW_HIDDEN_KEY = "factory-editor-show-hidden";
const KEY_TYPES = ["text", "long-text", "file"];
const DEFAULT_LOOP_MAX = 2;
const LOOP_MAX_LIMIT = 20;
function readShowHidden() { try { return localStorage.getItem(SHOW_HIDDEN_KEY) === "1"; } catch (e) { return false; } }
function saveShowHidden(value) { try { localStorage.setItem(SHOW_HIDDEN_KEY, value ? "1" : "0"); } catch (e) {} }
const state = { steps: [], columns: [], pipelines: [], loadedLevel: null, saveLevel: "local", model: null, checkTimer: null, checkCount: 0, hasError: true, commit: null, savedPath: null, original: null, confirmReplace: false, showHidden: readShowHidden() };
const byId = (id) => document.getElementById(id);

async function api(path, body) {
  const opts = { headers: { "X-Factory-Token": TOKEN } };
  if (body !== undefined) { opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(apiPath(path), opts);
  const data = await r.json();
  if (r.status === 409) { const conflict = new Error(data.error); conflict.conflict = true; throw conflict; }
  if (!r.ok) { showError(data.error || r.statusText); throw new Error(data.error || r.statusText); }
  hideError();
  return data;
}
function showError(text) { const e = byId("error"); e.textContent = text; e.style.display = "block"; }
function hideError() { byId("error").style.display = "none"; }
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v); }
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
function clear(node) { node.replaceChildren(); return node; }
function guard(fn) { return (...a) => fn(...a).catch(() => {}); }

function emptyModel() {
  return { id: "", description: "", model: "", effort: "", start_column: "", inputs: [], steps: [], extra: {} };
}
function isMap(v) { return !!v && typeof v === "object" && !Array.isArray(v); }
function loopOf(raw) {
  if (raw === undefined) return null;
  const m = isMap(raw) ? raw : {};
  return { raw, edited: false, back_to: m.back_to ?? "", while: m.while ?? "", max: m.max ?? DEFAULT_LOOP_MAX };
}
function loopData(l) {
  if (!l.edited) return l.raw;
  return { ...(isMap(l.raw) ? l.raw : {}), back_to: l.back_to, while: l.while, max: l.max };
}
function entryOf(raw) {
  const e = typeof raw === "string" ? { id: raw } : raw || {};
  return { id: e.id || "", model: e.model || "", effort: e.effort || "", column: e.column || "",
    with: Object.entries(e.with || {}).map(([key, value]) => ({ key, value: typeof value === "string" ? value : JSON.stringify(value) })),
    loop: loopOf(e.loop), open: false };
}
function modelOf(data) {
  const claude = data.claude || {};
  const known = new Set(["id", "description", "claude", "start_column", "inputs", "steps"]);
  const extra = Object.fromEntries(Object.entries(data).filter(([k]) => !known.has(k) && !k.startsWith("_")));
  return { id: data.id || "", description: data.description || "", model: claude.model || "", effort: claude.effort || "",
    start_column: data.start_column || "",
    inputs: Object.entries(data.inputs || {}).map(([key, v]) => ({ key, type: (v && v.type) || "text", description: (v && v.description) || "" })),
    steps: (data.steps || []).map(entryOf), extra };
}
function parseValue(text) {
  try { const v = JSON.parse(text); if (typeof v !== "string") return v; } catch (e) {}
  return text;
}
function dataOf(m) {
  const data = { ...m.extra, id: m.id, description: m.description, claude: { model: m.model, effort: m.effort },
    start_column: m.start_column, inputs: {}, steps: [] };
  for (const r of m.inputs) if (r.key) data.inputs[r.key] = { type: r.type, description: r.description };
  for (const s of m.steps) {
    const w = {};
    for (const r of s.with) if (r.key) w[r.key] = parseValue(r.value);
    const entry = { id: s.id, with: w, model: s.model, effort: s.effort, column: s.column };
    if (s.loop) entry.loop = loopData(s.loop);
    data.steps.push(entry);
  }
  return data;
}

function field(label, node) { return el("div", { class: "field" }, el("label", {}, label), node); }
function textInput(value, onChange, placeholder = "") {
  const i = el("input", { type: "text", placeholder });
  i.value = value;
  i.addEventListener("input", () => onChange(i.value));
  return i;
}
function selectInput(options, value, onChange) {
  const s = el("select");
  for (const o of options) s.append(el("option", { value: o }, o || "(none)"));
  s.value = value;
  s.addEventListener("change", () => onChange(s.value));
  return s;
}
function pairRows(rows, keyName, valueName, keyHint, valueHint) {
  const box = el("div");
  const draw = () => {
    clear(box);
    rows.forEach((r, i) => {
      box.append(el("div", { class: "row" },
        textInput(r[keyName], (v) => { r[keyName] = v; changed(); }, keyHint),
        textInput(r[valueName], (v) => { r[valueName] = v; changed(); }, valueHint),
        el("button", { type: "button", onclick: () => { rows.splice(i, 1); draw(); changed(); } }, "Remove")));
    });
    box.append(el("button", { type: "button", onclick: () => { rows.push({ [keyName]: "", [valueName]: "" }); draw(); } }, "Add"));
  };
  draw();
  return box;
}

function inputRows(rows) {
  const box = el("div");
  const draw = () => {
    clear(box);
    rows.forEach((r, i) => box.append(el("div", { class: "row" },
      textInput(r.key, (v) => { r.key = v; changed(); }, "key"),
      selectInput(KEY_TYPES, r.type || "text", (v) => { r.type = v; changed(); }),
      textInput(r.description, (v) => { r.description = v; changed(); }, "description"),
      el("button", { type: "button", onclick: () => { rows.splice(i, 1); draw(); changed(); } }, "Remove"))));
    box.append(el("button", { type: "button", onclick: () => { rows.push({ key: "", type: "text", description: "" }); draw(); } }, "Add"));
  };
  draw();
  return box;
}

function renderForm() {
  const m = state.model, f = clear(byId("form"));
  f.append(
    field("id", textInput(m.id, (v) => { m.id = v; changed(); })),
    field("description", textInput(m.description, (v) => { m.description = v; changed(); })),
    field("model", textInput(m.model, (v) => { m.model = v; changed(); }, "session model")),
    field("effort", textInput(m.effort, (v) => { m.effort = v; changed(); }, "session effort")),
    field("start_column", selectInput(["", ...state.columns], m.start_column, (v) => { m.start_column = v; changed(); })),
    field("inputs", inputRows(m.inputs)));
}

function nearestIndex(i, id) {
  for (let j = i; j >= 0; j--) if (state.model.steps[j].id === id) return j;
  return -1;
}
function loopMarkText(s) {
  if (!s.loop) return "";
  if (!s.loop.back_to) return `↺ ? ×${s.loop.max}`;
  return `↺ ${s.loop.back_to} ×${s.loop.max}`;
}
function backToChoices(i, backTo) {
  const choices = [];
  state.model.steps.slice(0, i + 1).forEach((e, j) => {
    if (nearestIndex(i, e.id) === j) choices.push([String(j), `${j + 1}. ${e.id}`]);
  });
  if (backTo !== null && nearestIndex(i, backTo) < 0) choices.push(["missing", `${backTo || "?"} (not found)`]);
  return choices;
}
function loopMark(s) {
  const tag = el("span", { class: "tag" }, loopMarkText(s));
  if (!s.loop) tag.style.display = "none";
  return tag;
}
function loopBlock(s, i, tag) {
  const editLoop = (fn) => { fn(s.loop); s.loop.edited = true; tag.textContent = loopMarkText(s); changed(); };
  const target = el("select");
  target.append(el("option", { value: "" }, "(no loop)"));
  const backTo = s.loop ? s.loop.back_to : null;
  backToChoices(i, backTo).forEach(([value, label]) => target.append(el("option", { value }, label)));
  const found = s.loop ? nearestIndex(i, backTo) : -1;
  target.value = !s.loop ? "" : found < 0 ? "missing" : String(found);
  target.addEventListener("change", () => {
    if (target.value === "missing") return;
    if (target.value === "") s.loop = null;
    else {
      s.loop = s.loop || loopOf({ back_to: "", while: "", max: DEFAULT_LOOP_MAX });
      s.loop.back_to = state.model.steps[Number(target.value)].id;
      s.loop.edited = true;
    }
    renderPipeline();
    changed();
  });
  const box = el("div", { class: "loop" }, el("div", { class: "muted" }, "loop"), field("back_to", target));
  if (!s.loop) return box;
  const listId = `loop-keys-${i}`;
  const keyList = el("datalist", { id: listId });

  let result;
  try {
    result = await api("/api/steps/save", { manifest: manifestOf(s.f), body: formBody(), level: s.level, mode: s.mode });
  } catch (e) {
    if (e.conflict) showError(e.message);
    return;
  }
  s.impact = null;
  s.saved = result;
  s.commit = result.library_commit;
  s.mode = "edit";
  s.level = result.level;
  await loadSteps();
  if (state.model) await runCheck();
  renderStepForm();
}
function userText(u) {
  if (u.kind === "task") return "task " + u.id;
  return (u.kind === "pipeline" ? "pipeline " : "group step ") + u.id + " (" + u.level + ")";
}
function deletePlanBlock(d, plan) {
  const block = el("div", { class: "card" }, el("div", {}, "Delete the " + plan.level + " step " + plan.id + ". Files:"));
  for (const f of plan.files) block.append(el("div", { class: "muted" }, f));
  if (plan.replaced_by) block.append(el("div", {}, "After the delete, the " + plan.replaced_by + " step " + plan.id + " is used."));
  if (plan.in_use_stays) block.append(el("div", {}, "The " + plan.in_use_stays + " step " + plan.id + " stays in use."));
  for (const w of plan.warnings) block.append(el("div", { class: "problem warning" }, "Warning: " + w));
  if (plan.blocked) {
    block.append(el("div", { class: "problem error" }, "The step is still used. Remove it from these first:"));
    for (const u of plan.users) block.append(el("div", { class: "problem error" }, userText(u)));
    return block;
  }
  block.append(el("div", { class: "row" },
    el("button", { type: "button", class: "primary", onclick: guard(() => deleteStep(d)) }, "Confirm delete"),
    el("button", { type: "button", onclick: () => block.remove() }, "Cancel")));
  return block;
}
async function deleteStep(d) {
  const result = await api("/api/steps/" + encodeURIComponent(d.id) + "/delete", { level: d.level });
  const box = clear(byId("detail"));
  box.append(el("div", {}, "Deleted the " + result.level + " step " + result.id + "."));
  for (const f of result.removed) box.append(el("div", { class: "muted" }, f));
  if (result.library_commit) {
    box.append(commitBox(result.library_commit, () => box.append(el("div", { class: "muted" }, "Committed to the library."))));
  }
  await loadSteps();
  if (state.model) await runCheck();
}

function changed(keepSaveResult = false) {
  if (!keepSaveResult) { state.commit = null; state.savedPath = null; }
  state.hasError = true;
  renderSave();
  clearTimeout(state.checkTimer);
  state.checkTimer = setTimeout(guard(runCheck), CHECK_DELAY_MS);
}
async function runCheck() {
  const ticket = ++state.checkCount;
  const problems = await api("/api/pipelines/check", { data: dataOf(state.model), level: state.saveLevel });
  if (ticket !== state.checkCount) return;
  const box = clear(byId("problems"));
  for (const p of problems) box.append(el("div", { class: "problem " + p.level }, p.level === "error" ? "Error: " : "Warning: ", p.message));
  if (!problems.length) box.append(el("div", { class: "muted" }, "No problems."));
  state.hasError = problems.some((p) => p.level === "error");
  renderSave();
}

function radio(value, label) {
  const input = el("input", { type: "radio", name: "level", value });
  input.checked = state.saveLevel === value;
  input.addEventListener("change", () => { state.saveLevel = value; changed(true); });
  return el("label", {}, input, " " + label + " ");
}
function renderSave() {
  const box = clear(byId("save"));
  const localLabel = state.loadedLevel === "generic" ? "Save a local override" : "Save local";
  box.append(el("div", { class: "row" }, radio("generic", "Save generic"), radio("local", localLabel)));
  const save = el("button", { type: "button", class: "primary", onclick: guard(() => savePipeline(false)) }, "Save");
  save.disabled = state.hasError;
  box.append(save);
  if (state.confirmReplace) {
    box.append(el("div", { class: "problem warning" }, "A pipeline with this id already exists at this level. Replace it?"),
      el("div", { class: "row" },
        el("button", { type: "button", class: "primary", onclick: guard(() => savePipeline(true)) }, "Replace"),
        el("button", { type: "button", onclick: () => { state.confirmReplace = false; renderSave(); } }, "Cancel")));
  }
  if (state.savedPath) box.append(el("div", { class: "muted" }, "Saved to " + state.savedPath));
  if (state.commit) {
    box.append(commitBox(state.commit, () => {
      state.commit = null;
      state.savedPath = state.savedPath + " (committed to the library)";
      renderSave();
    }));
  }
}
function commitBox(offer, done) {
  const box = el("div", {}, el("div", {}, "The library is a git repository. Files:"));
  for (const p of offer.paths) box.append(el("div", { class: "muted" }, p));
  box.append(el("div", {}, offer.message),
    el("button", { type: "button", onclick: guard(async () => {
      await api("/api/library/commit", { message: offer.message, paths: offer.paths });
      done();
    }) }, "Commit to library"));
  return box;
}
async function savePipeline(replace) {
  const body = { data: dataOf(state.model), level: state.saveLevel, replace };
  if (state.original) { body.original_id = state.original.id; body.original_level = state.original.level; }
  let result;
  try {
    result = await api("/api/pipelines/save", body);
  } catch (e) {
    if (!e.conflict) throw e;
    state.confirmReplace = true;
    renderSave();
    return;
  }
  state.confirmReplace = false;
  state.original = { id: body.data.id, level: result.level };
  state.savedPath = result.path;
  state.commit = result.library_commit;
  state.loadedLevel = result.level;
  renderSave();
}
function openModel(model, level, original = null) {
  state.model = model;
  state.original = original;
  state.confirmReplace = false;
  state.loadedLevel = level;
  state.saveLevel = level === "generic" ? "generic" : "local";
  byId("start").hidden = true;
  byId("editor").hidden = false;
  byId("title").textContent = model.id || "new pipeline";
  renderForm();
  renderPipeline();
  changed();
}
async function loadPipeline(id) {
  const loaded = await api("/api/pipelines/" + encodeURIComponent(id));
  openModel(modelOf(loaded.data), loaded.level, { id: loaded.data.id, level: loaded.level });
}
function pipelineSelect() {
  const s = el("select");
  for (const p of state.pipelines) s.append(el("option", { value: p.id }, p.id + " (" + p.level + ")"));
  return s;
}
function renderStart() {
  const box = clear(byId("start"));
  box.hidden = false;
  box.append(el("h3", {}, "Start"));
  box.append(el("div", { class: "row" }, el("button", { type: "button", onclick: () => openStepForm({ mode: "new" }) }, "New step")));
  box.append(el("div", { class: "row" }, el("button", { type: "button", class: "primary", onclick: () => openModel(emptyModel(), null) }, "Create an empty pipeline")));
  const copySelect = pipelineSelect();
  const newId = el("input", { type: "text", placeholder: "new pipeline id" });
  box.append(el("div", { class: "row" },
    el("button", { type: "button", onclick: guard(async () => {
      const copied = await api("/api/pipelines/copy", { source: copySelect.value, new_id: newId.value });
      openModel(modelOf(copied.data), null);
    }) }, "Copy an existing pipeline"), copySelect, newId));
  const editSelect = pipelineSelect();
  box.append(el("div", { class: "row" },
    el("button", { type: "button", onclick: guard(() => loadPipeline(editSelect.value)) }, "Edit an existing pipeline"), editSelect));
}

async function init() {
  const info = await api("/api/info");
  state.columns = info.columns;
  setupDrop();
  await loadSteps();
  state.formData = await api("/api/step-form");
  byId("newstep").addEventListener("click", () => openStepForm({ mode: "new" }));
  const stepParam = params.get("step");
  if (params.get("new_step")) openStepForm({ mode: "new" });
  else if (stepParam) {
    try {
      const d = await api("/api/steps/" + encodeURIComponent(stepParam));
      openStepForm({ mode: d.level === "builtin" ? "copy-local" : "edit", detail: d });
    } catch (e) {}
  }
  const id = params.get("id");
  let failure = null;
  if (id) {
    try { await loadPipeline(id); return; } catch (e) { failure = e.message; }
  }
  state.pipelines = await api("/api/pipelines");
  renderStart();
  if (failure) showError(failure);
}
const THEME_KEY = "factory.theme";
function themeLabel() {
  const label = document.documentElement.dataset.theme === "light" ? "Switch to dark mode" : "Switch to light mode";
  const b = byId("theme-toggle");
  b.setAttribute("aria-label", label);
  b.title = label;
}
byId("theme-toggle").addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch (e) {}
  themeLabel();
});
themeLabel();
init().catch(() => {});
</script>
</body>
</html>
