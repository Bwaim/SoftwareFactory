name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release files
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/software-factory.tar.gz dist/software-factory.tar.gz.sha256 install.sh --title "$GITHUB_REF_NAME" --notes ""
